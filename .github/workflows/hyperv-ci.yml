name: Hyper-V host layer CI

on:
  pull_request:
    paths:
      - 'scripts/hyperv/**'
      - 'tests/hyperv/**'
      - '.github/workflows/hyperv-ci.yml'
  push:
    paths:
      - 'scripts/hyperv/**'
      - 'tests/hyperv/**'
      - '.github/workflows/hyperv-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester tests and coverage (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          $install = "`$ErrorActionPreference = 'Stop'; Set-PSRepository -Name PSGallery -InstallationPolicy Trusted; Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck"
          if ('${{ matrix.shell }}' -eq 'powershell') { $install = "Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null; " + $install }
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -Command $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests with code coverage
        shell: pwsh
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File tests/hyperv/Invoke-HyperVTests.ps1 -PesterVersion 5.7.1 -CoveragePath "$env:RUNNER_TEMP/hyperv-coverage-${{ matrix.shell }}.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: hyperv-coverage-${{ matrix.shell }}
          path: ${{ runner.temp }}/hyperv-coverage-${{ matrix.shell }}.xml
          retention-days: 14

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install PSScriptAnalyzer 1.24.0
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Analyze scripts/hyperv and tests/hyperv (fail on Error, report Warning)
        shell: pwsh
        run: |
          $findings = foreach ($path in 'scripts/hyperv', 'tests/hyperv') {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error, Warning
          }
          foreach ($f in $findings) {
            $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
            $file = [IO.Path]::GetRelativePath($PWD.Path, $f.ScriptPath).Replace('\', '/')
            $text = $f.Message -replace '\r?\n', ' '
            Write-Host "::${level} file=${file},line=$($f.Line)::$($f.RuleName): $text"
          }
          $errors = @($findings | Where-Object Severity -EQ 'Error').Count
          Write-Host ('PSScriptAnalyzer: {0} error(s), {1} warning(s)' -f $errors, (@($findings).Count - $errors))
          if ($errors -gt 0) { exit 1 }
