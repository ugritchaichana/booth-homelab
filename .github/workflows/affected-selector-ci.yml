name: Affected Test Selector CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'scripts/apps/dotnet-affected-test.*'
      - 'tests/**'
      - '.github/workflows/affected-selector-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'scripts/apps/dotnet-affected-test.*'
      - 'tests/**'
      - '.github/workflows/affected-selector-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-selector-harness:
    name: Verify Affected Graph Selector Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore apps/backend/SdetTestingRig.sln

      - name: Run Bash Selector Test Harness (7 Scenarios)
        run: ./tests/verify-affected-graph.sh

      - name: Run PowerShell Selector Test Harness (6 Scenarios)
        run: pwsh -File ./tests/verify-affected-graph.ps1

      - name: Mutation Check (Each Fail-Closed Mutant Must Fail Its Scenario)
        run: |
          src=scripts/apps/dotnet-affected-test.sh
          src_lines=$(wc -l < "$src")
          status=0
          attempted=0
          while IFS='|' read -r name expr scenario delta; do
            attempted=$((attempted + 1))
            mutant="$RUNNER_TEMP/mutant-$name.sh"
            log="$RUNNER_TEMP/mutant-$name.log"
            sed "$expr" "$src" > "$mutant"
            if cmp -s "$src" "$mutant"; then
              echo "::error::$name did not mutate the selector"
              status=1
              continue
            fi
            if [ "$delta" != "*" ] && [ $((src_lines - $(wc -l < "$mutant"))) -ne "$delta" ]; then
              echo "::error::$name removed an unexpected number of lines"
              status=1
              continue
            fi
            if SELECTOR_SH="$mutant" ./tests/verify-affected-graph.sh < /dev/null > "$log" 2>&1; then
              cat "$log"
              echo "::error::$name survived: harness passed against the mutant"
              status=1
              continue
            fi
            if ! grep -q "\[FAIL\] $scenario" "$log"; then
              tail -n 6 "$log"
              echo "::error::$name was not killed by $scenario"
              status=1
              continue
            fi
            echo "$name killed by $scenario"
          done <<'MUTANTS'
          M1|/^# 2\.2 Unmappable Change Resolution/,/^fi[[:space:]]*$/d|SCENARIO 3|*
          M2|/^# 2\.2 Unmappable Change Resolution/,/^fi[[:space:]]*$/{/mapfile -t UNIQUE_DIRECT/d}|SCENARIO 4|1
          M3|/^# 2\.1 Shared Build Configuration/,/^fi[[:space:]]*$/{/mapfile -t UNIQUE_DIRECT/d}|SCENARIO 7|1
          MUTANTS
          if [ "$attempted" -ne 3 ]; then
            echo "::error::Expected 3 mutants to be attempted, got $attempted"
            status=1
          fi
          exit "$status"
