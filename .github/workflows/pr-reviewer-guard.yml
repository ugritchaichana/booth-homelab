name: PR Reviewer Guard

on:
  pull_request_target:
    types: [opened, review_requested]

permissions:
  pull-requests: write

jobs:
  strip-copilot-reviewer:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove Copilot Pull Request Reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "[*] Ensuring copilot-pull-request-reviewer is removed from PR #${PR_NUMBER}"
          if ! output=$(gh api --method DELETE "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" -f 'reviewers[]=copilot-pull-request-reviewer' 2>&1); then
            echo "::warning::could not remove the reviewer from PR #${PR_NUMBER}: ${output}"
          fi
