name: SDET Homelab CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      force_ubuntu_runner:
        description: 'Force GitHub-hosted ubuntu-latest; otherwise CI_RUNNER and the runner health check decide'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  pipeline:
    name: CI
    uses: ./.github/workflows/reusable-sdet-pipeline.yml
    secrets: inherit
    with:
      target_branch: ${{ github.head_ref || github.ref_name }}
      base_ref: ${{ github.base_ref && format('origin/{0}', github.base_ref) || (github.event_name == 'pull_request' && 'origin/master' || (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1')) }}
      force_ubuntu_runner: ${{ vars.CI_RUNNER != 'proxmox' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'workflow_dispatch' && inputs.force_ubuntu_runner) }}
