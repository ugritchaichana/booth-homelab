name: SDET Homelab CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    name: CI
    uses: ./.github/workflows/reusable-sdet-pipeline.yml
    with:
      target_branch: ${{ github.head_ref || github.ref_name }}
      base_ref: ${{ github.base_ref && format('origin/{0}', github.base_ref) || (github.event_name == 'pull_request' && 'origin/master' || 'HEAD~1') }}
