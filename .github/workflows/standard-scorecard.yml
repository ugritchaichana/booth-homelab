name: Standard Scorecard

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          mkdir -p "$RUNNER_TEMP/bin"
          mv gitleaks "$RUNNER_TEMP/bin/gitleaks"
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install coverage.py
        run: python3 -m pip install --require-hashes -r tests/requirements-coverage-ci.txt

      - name: Scorecard unit tests, measured through the scorer subprocess
        run: |
          printf '[run]\nbranch = True\npatch = subprocess\n' > "$RUNNER_TEMP/coveragerc"
          export COVERAGE_RCFILE="$RUNNER_TEMP/coveragerc"
          coverage run --branch --source=standard --omit='standard/tests/*' standard/tests/test_scorecard.py
          coverage combine
          coverage report -m --precision=2 --fail-under=89

      - name: Print the Line and Branch Split
        run: |
          coverage json -o - | python3 -c 'import json,sys; t=json.load(sys.stdin)["totals"]; print("lines %.2f%% (%d of %d), branches %.2f%% (%d of %d)" % (100*t["covered_lines"]/t["num_statements"], t["covered_lines"], t["num_statements"], 100*t["covered_branches"]/t["num_branches"], t["covered_branches"], t["num_branches"]))'

      - name: Run checks, read the ledger, write the scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 standard/scorecard.py

  doc-claims:
    name: Documentation claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Every numeric or superlative claim links to evidence
        run: bash standard/checks/4.2.sh
