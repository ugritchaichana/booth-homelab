name: Standard Scorecard

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          mkdir -p "$RUNNER_TEMP/bin"
          mv gitleaks "$RUNNER_TEMP/bin/gitleaks"
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scorecard unit tests
        run: python3 standard/tests/test_scorecard.py

      - name: Run checks, read the ledger, write the scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 standard/scorecard.py

  doc-claims:
    name: Documentation claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Every numeric or superlative claim links to evidence
        run: bash standard/checks/4.2.sh
