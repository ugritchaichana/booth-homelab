name: SDET Callback

on:
  workflow_run:
    workflows: ["SDET Homelab CI Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the SDET pipeline to report on'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: sdet-callback-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  report:
    name: Report to the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Collect, Render and Post the Run Report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: bash scripts/ci/sdet-report.sh
