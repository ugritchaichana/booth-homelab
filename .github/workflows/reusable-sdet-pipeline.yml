name: Reusable SDET Pipeline

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
    outputs:
      cache_hit:
        description: 'Cache hit status'
        value: ${{ jobs.dotnet-build.outputs.cache_hit }}
      build_duration_ms:
        description: 'Build duration in ms'
        value: ${{ jobs.dotnet-build.outputs.build_duration_ms }}
      test_duration_ms:
        description: 'Test duration in ms'
        value: ${{ jobs.dotnet-test.outputs.test_duration_ms }}
      angular_duration_ms:
        description: 'Angular Jest duration in ms'
        value: ${{ jobs.angular-jest.outputs.angular_duration_ms }}

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'

jobs:
  # ============================================================================
  # Stage 1: Host & Hardware Sanity Check
  # ============================================================================
  telemetry:
    name: Telemetry
    runs-on: [self-hosted, linux, proxmox, dotnet]
    steps:
      - name: Inspect Runner Telemetry
        shell: bash
        run: |
          echo "=========================================================="
          echo "      PROXMOX VE SELF-HOSTED RUNNER TELEMETRY            "
          echo "=========================================================="
          echo "Hostname:    $(hostname)"
          echo "Kernel:      $(uname -r)"
          echo "CPU Cores:   $(nproc)"
          echo "Memory:"
          free -h
          echo "Docker Info:"
          docker --version || true
          echo ".NET SDK Version:"
          dotnet --version || true
          echo "MinIO Health Check:"
          curl -s -I http://10.99.20.20:9000/minio/health/live | grep -E "HTTP/|Server" || true
          echo "=========================================================="

  # ============================================================================
  # Stage 2: .NET Solution Build & Remote Cache Restore (CT 102)
  # ============================================================================
  dotnet-build:
    name: Build (.NET)
    needs: [telemetry]
    runs-on: [self-hosted, linux, proxmox, dotnet]
    outputs:
      cache_hit: ${{ steps.restore-cache.outputs.cache_hit }}
      build_duration_ms: ${{ steps.compile.outputs.build_duration_ms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/sdet/*.sh 2>/dev/null || true

      - name: Restore Remote MinIO Cache
        id: restore-cache
        uses: ./.github/actions/minio-cache
        with:
          mode: restore
          branch: ${{ inputs.target_branch }}

      - name: Compile Solution (/p:Deterministic=true)
        id: compile
        shell: bash
        run: |
          echo "==> Building .NET 8 Backend Solution..."
          BUILD_START=$(date +%s%N)
          dotnet build sdet/backend/SdetTestingRig.sln --configuration Release /p:Deterministic=true
          BUILD_END=$(date +%s%N)
          BUILD_MS=$(( (BUILD_END - BUILD_START) / 1000000 ))
          echo "build_duration_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"
          echo "=========================================================="
          echo " [BENCHMARK] Build Time: ${BUILD_MS} ms"
          echo "=========================================================="

  # ============================================================================
  # Stage 3: .NET Unit & Integration Tests (CT 102)
  # ============================================================================
  dotnet-test:
    name: Test (.NET)
    needs: [dotnet-build]
    runs-on: [self-hosted, linux, proxmox, dotnet]
    outputs:
      test_duration_ms: ${{ steps.run-tests.outputs.test_duration_ms }}
    steps:
      - name: Checkout Repository (Preserve Binaries)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/sdet/*.sh 2>/dev/null || true

      - name: Execute Transitive Affected Tests (Unit & Integration)
        id: run-tests
        uses: ./.github/actions/run-affected-tests
        with:
          base_ref: ${{ inputs.base_ref }}
          head_ref: HEAD

      - name: Archive .NET Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdet-dotnet-test-results
          path: sdet/backend/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # Stage 4: .NET Cache Update & Upload to MinIO S3 (CT 102)
  # ============================================================================
  dotnet-cache-save:
    name: Cache (.NET)
    needs: [dotnet-build, dotnet-test]
    if: always() && needs.dotnet-build.result == 'success'
    runs-on: [self-hosted, linux, proxmox, dotnet]
    steps:
      - name: Checkout Repository (Preserve Binaries)
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/sdet/*.sh 2>/dev/null || true

      - name: Save Remote MinIO Cache
        uses: ./.github/actions/minio-cache
        with:
          mode: save
          branch: ${{ inputs.target_branch }}
          commit_sha: ${{ github.sha }}

  # ============================================================================
  # Stage 5: Angular Jest Unit Tests (CT 103 Dedicated Runner)
  # ============================================================================
  angular-jest:
    name: Test (Angular)
    runs-on: [self-hosted, linux, proxmox, angular]
    outputs:
      angular_duration_ms: ${{ steps.run-angular.outputs.angular_duration_ms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/sdet/*.sh 2>/dev/null || true

      - name: Execute Angular Jest Suite
        id: run-angular
        uses: ./.github/actions/run-angular-jest

      - name: Archive Angular Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdet-angular-coverage
          path: sdet/frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================================
  # Stage 6: Combined Performance & Quality Summary
  # ============================================================================
  summary:
    name: Report
    needs: [telemetry, dotnet-build, dotnet-test, dotnet-cache-save, angular-jest]
    if: always()
    runs-on: [self-hosted, linux, proxmox, dotnet]
    steps:
      - name: Generate Pipeline Summary Report
        shell: bash
        run: |
          CACHE_HIT="${{ needs.dotnet-build.outputs.cache_hit }}"
          BUILD_MS="${{ needs.dotnet-build.outputs.build_duration_ms }}"
          DOTNET_TEST_MS="${{ needs.dotnet-test.outputs.test_duration_ms }}"
          ANGULAR_MS="${{ needs.angular-jest.outputs.angular_duration_ms }}"

          echo "=========================================================="
          echo "       HOMELAB CI/CD TUNING PERFORMANCE REPORT           "
          echo "=========================================================="
          echo "Branch / Ref:         ${{ inputs.target_branch }}"
          echo "Base Ref:             ${{ inputs.base_ref }}"
          echo "Cache Hit Status:     ${CACHE_HIT:-false}"
          echo "Build Duration:       ${BUILD_MS:-N/A} ms"
          echo ".NET Test Duration:   ${DOTNET_TEST_MS:-N/A} ms"
          echo "Angular Test Duration:${ANGULAR_MS:-N/A} ms"
          echo "=========================================================="

          # Write GitHub Step Summary
          {
            echo "## 🚀 Homelab SDET Performance & Optimization Report"
            echo ""
            echo "| Technology Stack | Target Runner | Duration | Status |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **.NET 8 Solution Build** | \`pve-runner-01\` (CT 102) | **${BUILD_MS:-0} ms** | ${{ needs.dotnet-build.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **.NET Unit & Integration Tests** | \`pve-runner-01\` (CT 102) | **${DOTNET_TEST_MS:-0} ms** | ${{ needs.dotnet-test.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **Angular Jest Unit Tests** | \`pve-runner-angular\` (CT 103) | **${ANGULAR_MS:-0} ms** | ${{ needs.angular-jest.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **MinIO S3 Cache Transfer** | Virtual Bus (\`10.99.20.20:9000\`) | Cache Hit: \`${CACHE_HIT:-false}\` | ⚡ Ultra-fast |"
            echo ""
            echo "### Parallel Dual-Runner Architecture"
            echo "- 🖥️ **CT 102 (Debian LXC / .NET):** Executed .NET 8 compilation, unit tests, and integration tests."
            echo "- ⚡ **CT 103 (Debian LXC / Angular):** Executed Angular Standalone Jest component & service tests."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.dotnet-build.result }}" != "success" ] || [ "${{ needs.dotnet-test.result }}" != "success" ] || [ "${{ needs.angular-jest.result }}" != "success" ]; then
            echo "::error::One or more pipeline stages failed!"
            exit 1
          fi
