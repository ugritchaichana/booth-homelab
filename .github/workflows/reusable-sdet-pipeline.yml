name: Reusable SDET Pipeline

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
      force_ubuntu_runner:
        description: 'Force execution on GitHub-hosted ubuntu-latest runners'
        required: false
        type: boolean
        default: false
    outputs:
      cache_hit:
        description: 'true when every project restored its build outputs from the cache'
        value: ${{ jobs.dotnet.outputs.cache_hit_dotnet_outputs }}
      build_duration_ms:
        description: 'Build duration in ms'
        value: ${{ jobs.dotnet.outputs.build_duration_ms }}
      unit_duration_ms:
        description: '.NET unit test duration in ms'
        value: ${{ jobs.dotnet-unit.outputs.test_duration_ms }}
      integration_duration_ms:
        description: '.NET integration test duration in ms'
        value: ${{ jobs.dotnet-integration.outputs.test_duration_ms }}
      angular_duration_ms:
        description: 'Angular Jest duration in ms'
        value: ${{ jobs.angular-jest.outputs.angular_duration_ms }}

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
      force_ubuntu_runner:
        description: 'Force execution on GitHub-hosted ubuntu-latest runners'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  select-runner:
    name: Select Runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      hosted: ${{ steps.decide.outputs.hosted }}
      dotnet_labels: ${{ steps.decide.outputs.dotnet_labels }}
      angular_labels: ${{ steps.decide.outputs.angular_labels }}
      runner_label: ${{ steps.decide.outputs.runner_label }}
      route_reason: ${{ steps.decide.outputs.route_reason }}
    steps:
      - name: Checkout Router
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Decide Runner Class
        id: decide
        shell: bash
        env:
          FORCED_HOSTED: ${{ inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/ci/select-runner.sh

  telemetry:
    name: Telemetry
    needs: [select-runner]
    timeout-minutes: 5
    runs-on: ${{ fromJSON(needs.select-runner.outputs.dotnet_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
    steps:
      - name: Inspect Runner Telemetry
        shell: bash
        run: |
          echo "=========================================================="
          echo "           RUNNER SYSTEM TELEMETRY                       "
          echo "=========================================================="
          echo "Runner Mode: ${{ needs.select-runner.outputs.runner_label }}"
          echo "Hostname:    $(hostname)"
          echo "Runner:      $RUNNER_NAME"
          echo "Workspace:   $GITHUB_WORKSPACE"
          echo "Kernel:      $(uname -r)"
          echo "CPU Cores:   $(nproc)"
          echo "Memory:"
          free -h
          echo "Docker Info:"
          docker --version 2>/dev/null || true
          echo ".NET SDK Version:"
          dotnet --version 2>/dev/null || true
          if [ -n "$CACHE_URL" ]; then
            echo "Build Cache Status:"
            curl -s -m 2 "$CACHE_URL/status" || echo "Build cache unreachable (cold build fallback active)"
            echo ""
          fi
          echo "=========================================================="

  dotnet:
    name: Build (.NET)
    needs: [select-runner]
    timeout-minutes: 30
    runs-on: ${{ fromJSON(needs.select-runner.outputs.dotnet_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
      BUILD_CACHE_RUNNER_CLASS: ${{ needs.select-runner.outputs.hosted != 'true' && 'lxc-runner' || '' }}
    outputs:
      compiled: ${{ steps.compile.outcome == 'success' }}
      cache_hit_nuget: ${{ steps.restore-nuget.outputs.hit }}
      cache_hit_dotnet_outputs: ${{ steps.restore-outputs.outputs.hit }}
      restored_dotnet_outputs: ${{ steps.restore-outputs.outputs.restored }}
      compiled_projects: ${{ steps.compile.outputs.compiled_projects }}
      reused_projects: ${{ steps.compile.outputs.reused_projects }}
      build_duration_ms: ${{ steps.compile.outputs.build_duration_ms }}
      unit_count: ${{ steps.select.outputs.unit_count }}
      integration_count: ${{ steps.select.outputs.integration_count }}
      workspace: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: needs.select-runner.outputs.hosted == 'true'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Cache
        id: restore-nuget
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          kind: nuget
          stats-file: ${{ runner.temp }}/build-cache-stats.jsonl

      - name: Restore NuGet Packages (Locked)
        shell: bash
        run: dotnet restore apps/backend/SdetTestingRig.sln --locked-mode

      - name: Restore Build Outputs Cache
        id: restore-outputs
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          kind: dotnet-outputs
          stats-file: ${{ runner.temp }}/build-cache-stats.jsonl

      - name: Compile Solution (/p:Deterministic=true)
        id: compile
        shell: bash
        run: |
          echo "==> Building .NET 8 Backend Solution..."
          BUILD_START=$(date +%s%N)
          set +e
          dotnet build apps/backend/SdetTestingRig.sln --configuration Release --no-restore /p:Deterministic=true "-flp:verbosity=detailed;logfile=$RUNNER_TEMP/build.log"
          rc=$?
          set -e
          BUILD_MS=$(( ($(date +%s%N) - BUILD_START) / 1000000 ))
          COMPILED=$(grep -cE 'Building target "CoreCompile" (completely|partially)' "$RUNNER_TEMP/build.log" || true)
          REUSED=$(grep -c 'Skipping target "CoreCompile"' "$RUNNER_TEMP/build.log" || true)
          {
            echo "build_duration_ms=${BUILD_MS}"
            echo "compiled_projects=${COMPILED}"
            echo "reused_projects=${REUSED}"
          } >> "$GITHUB_OUTPUT"
          echo "=========================================================="
          echo " [BENCHMARK] Build Time: ${BUILD_MS} ms"
          echo " [BENCHMARK] CoreCompile ran in ${COMPILED} projects and was skipped in ${REUSED}"
          echo "=========================================================="
          exit $rc

      - name: Pack Cache Payloads
        if: ${{ always() && steps.compile.outcome == 'success' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-payload"
          tar -C "$NUGET_PACKAGES" -cf "$RUNNER_TEMP/cache-payload/nuget.tar" .
          find apps/backend apps/fixtures -type d \( -name bin -o -name obj \) -prune -print0             | tar --null -T - -cf "$RUNNER_TEMP/cache-payload/dotnet-outputs.tar"

      - name: Upload Cache Payloads
        if: ${{ always() && steps.compile.outcome == 'success' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cache-payload-dotnet
          path: ${{ runner.temp }}/cache-payload/
          retention-days: 1
          if-no-files-found: error

      - name: Select Affected Test Projects
        id: select
        uses: ./.github/actions/run-affected-tests
        with:
          base_ref: ${{ inputs.base_ref }}
          head_ref: HEAD
          list-dir: ${{ runner.temp }}/test-bin

      - name: Stage Test Binaries
        if: steps.select.outputs.unit_count != '0' || steps.select.outputs.integration_count != '0'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/test-bin"
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            mkdir -p "$stage/$(dirname "$project")"
            cp -a "$(dirname "$project")/bin" "$stage/$(dirname "$project")/"
          done < "$stage/affected.txt"
          du -sh "$stage"

      - name: Upload Test Binaries
        if: steps.select.outputs.unit_count != '0' || steps.select.outputs.integration_count != '0'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dotnet-test-bin
          path: ${{ runner.temp }}/test-bin/
          retention-days: 1
          if-no-files-found: error

      - name: Cache Hit Report
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/build-cache-stats.jsonl" ]; then
            PYTHONPATH=scripts/ci python3 -m build_cache report --stats-file "$RUNNER_TEMP/build-cache-stats.jsonl"
          fi

  dotnet-unit:
    name: Test (.NET unit)
    needs: [select-runner, dotnet]
    if: needs.dotnet.outputs.unit_count != '0'
    timeout-minutes: 20
    runs-on: ${{ fromJSON(needs.select-runner.outputs.dotnet_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
    outputs:
      test_duration_ms: ${{ steps.run-tests.outputs.test_duration_ms }}
    steps:
      - name: Checkout Test Runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/apps

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: needs.select-runner.outputs.hosted == 'true'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Download Test Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dotnet-test-bin
          path: ${{ github.workspace }}

      - name: Run .NET Unit Tests
        id: run-tests
        shell: bash
        run: |
          START=$(date +%s%N)
          set +e
          bash scripts/apps/dotnet-run-tests.sh affected-unit.txt apps/backend/TestResults
          rc=$?
          set -e
          echo "test_duration_ms=$(( ($(date +%s%N) - START) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Archive .NET Unit Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-dotnet-unit-results
          path: apps/backend/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  dotnet-integration:
    name: Test (.NET integration)
    needs: [select-runner, dotnet]
    if: needs.dotnet.outputs.integration_count != '0'
    timeout-minutes: 20
    runs-on: ${{ fromJSON(needs.select-runner.outputs.dotnet_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
    outputs:
      test_duration_ms: ${{ steps.run-tests.outputs.test_duration_ms }}
    steps:
      - name: Checkout Test Runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/apps

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: needs.select-runner.outputs.hosted == 'true'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Download Test Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dotnet-test-bin
          path: ${{ github.workspace }}

      - name: Run .NET Integration Tests
        id: run-tests
        shell: bash
        run: |
          START=$(date +%s%N)
          set +e
          bash scripts/apps/dotnet-run-tests.sh affected-integration.txt apps/backend/TestResults
          rc=$?
          set -e
          echo "test_duration_ms=$(( ($(date +%s%N) - START) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Archive .NET Integration Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-dotnet-integration-results
          path: apps/backend/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  dotnet-cache-save:
    name: Cache (.NET)
    needs: [select-runner, dotnet]
    timeout-minutes: 10
    environment: cache-writer
    if: always() && needs.dotnet.outputs.compiled == 'true' && needs.select-runner.outputs.hosted != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(needs.select-runner.outputs.dotnet_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
      BUILD_CACHE_RUNNER_CLASS: ${{ needs.select-runner.outputs.hosted != 'true' && 'lxc-runner' || '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Cache Payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cache-payload-dotnet
          path: ${{ runner.temp }}/cache-payload

      - name: Unpack Cache Payloads
        shell: bash
        run: |
          verify_members() {
            if ! tar -tf "$1" | awk -v allowed="$2" '/^\// || /(^|\/)\.\.(\/|$)/ || $0 !~ allowed {bad=1} END {exit bad}'; then
              echo "::error::$1 holds a member outside $2, an absolute path or a parent reference"
              exit 1
            fi
            if ! tar -tvf "$1" | awk '/^[lh]/ {bad=1} END {exit bad}'; then
              echo "::error::$1 holds a link member"
              exit 1
            fi
          }
          mkdir -p "$NUGET_PACKAGES"
          verify_members "$RUNNER_TEMP/cache-payload/nuget.tar" '^[.]/'
          verify_members "$RUNNER_TEMP/cache-payload/dotnet-outputs.tar" '^apps/(backend|fixtures)/'
          tar -C "$NUGET_PACKAGES" -xf "$RUNNER_TEMP/cache-payload/nuget.tar"
          tar -xf "$RUNNER_TEMP/cache-payload/dotnet-outputs.tar"

      - name: Save NuGet Cache
        uses: ./.github/actions/build-cache
        env:
          CACHE_WRITER_PASSWORD: ${{ secrets.CACHE_WRITER_PASSWORD }}
          BUILD_CACHE_WRITER_TOKEN: '1'
        with:
          mode: save
          kind: nuget

      - name: Save Build Outputs Cache
        uses: ./.github/actions/build-cache
        env:
          CACHE_WRITER_PASSWORD: ${{ secrets.CACHE_WRITER_PASSWORD }}
          BUILD_CACHE_WRITER_TOKEN: '1'
          BUILD_CACHE_KEY_ROOT: ${{ needs.dotnet.outputs.workspace }}
        with:
          mode: save
          kind: dotnet-outputs

  angular-cache-save:
    name: Cache (Angular)
    needs: [select-runner, angular-jest]
    timeout-minutes: 10
    environment: cache-writer
    if: always() && needs.angular-jest.result == 'success' && needs.angular-jest.outputs.cache_hit_node_modules != 'true' && needs.select-runner.outputs.hosted != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(needs.select-runner.outputs.angular_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
      BUILD_CACHE_RUNNER_CLASS: ${{ needs.select-runner.outputs.hosted != 'true' && 'lxc-runner' || '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Cache Payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cache-payload-node-modules
          path: ${{ runner.temp }}/cache-payload

      - name: Unpack Cache Payload
        shell: bash
        run: |
          verify_members() {
            if ! tar -tf "$1" | awk -v allowed="$2" '/^\// || /(^|\/)\.\.(\/|$)/ || $0 !~ allowed {bad=1} END {exit bad}'; then
              echo "::error::$1 holds a member outside $2, an absolute path or a parent reference"
              exit 1
            fi
            if ! tar -tvf "$1" | awk '/^[lh]/ {bad=1} END {exit bad}'; then
              echo "::error::$1 holds a link member"
              exit 1
            fi
          }
          verify_members "$RUNNER_TEMP/cache-payload/node_modules.tar" '^node_modules(/|$)'
          tar -C apps/frontend -xf "$RUNNER_TEMP/cache-payload/node_modules.tar"

      - name: Save node_modules Cache
        uses: ./.github/actions/build-cache
        env:
          CACHE_WRITER_PASSWORD: ${{ secrets.CACHE_WRITER_PASSWORD }}
          BUILD_CACHE_WRITER_TOKEN: '1'
        with:
          mode: save
          kind: node_modules

  angular-jest:
    name: Test (Angular)
    needs: [select-runner]
    timeout-minutes: 20
    runs-on: ${{ fromJSON(needs.select-runner.outputs.angular_labels) }}
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
      BUILD_CACHE_RUNNER_CLASS: ${{ needs.select-runner.outputs.hosted != 'true' && 'lxc-runner' || '' }}
    outputs:
      angular_duration_ms: ${{ steps.run-angular.outputs.angular_duration_ms }}
      cache_hit_node_modules: ${{ steps.run-angular.outputs.cache_hit_node_modules }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js 22 (Fallback Runner)
        if: needs.select-runner.outputs.hosted == 'true'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'

      - name: Execute Angular Jest Suite
        id: run-angular
        uses: ./.github/actions/run-angular-jest

      - name: Pack node_modules Payload
        if: ${{ steps.run-angular.outputs.cache_hit_node_modules != 'true' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-payload"
          tar -C apps/frontend -cf "$RUNNER_TEMP/cache-payload/node_modules.tar" node_modules

      - name: Upload node_modules Payload
        if: ${{ steps.run-angular.outputs.cache_hit_node_modules != 'true' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cache-payload-node-modules
          path: ${{ runner.temp }}/cache-payload/
          retention-days: 1
          if-no-files-found: error

      - name: Archive Angular Test Results and Coverage
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-angular-results
          path: |
            apps/frontend/test-results/
            apps/frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Report
    needs: [select-runner, telemetry, dotnet, dotnet-unit, dotnet-integration, dotnet-cache-save, angular-cache-save, angular-jest]
    timeout-minutes: 5
    if: ${{ !cancelled() && needs.select-runner.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      CACHE_URL: ${{ needs.select-runner.outputs.hosted != 'true' && 'http://10.99.17.10:8080' || '' }}
      ROUTE_REASON: ${{ needs.select-runner.outputs.route_reason }}
      RUNNER_LABEL: ${{ needs.select-runner.outputs.runner_label }}
      BUILD_RESULT: ${{ needs.dotnet.result }}
      UNIT_RESULT: ${{ needs.dotnet-unit.result }}
      INTEGRATION_RESULT: ${{ needs.dotnet-integration.result }}
      ANGULAR_RESULT: ${{ needs.angular-jest.result }}
      HIT_NUGET: ${{ needs.dotnet.outputs.cache_hit_nuget }}
      HIT_OUTPUTS: ${{ needs.dotnet.outputs.cache_hit_dotnet_outputs }}
      RESTORED_OUTPUTS: ${{ needs.dotnet.outputs.restored_dotnet_outputs }}
      HIT_NODE: ${{ needs.angular-jest.outputs.cache_hit_node_modules }}
      COMPILED_PROJECTS: ${{ needs.dotnet.outputs.compiled_projects }}
      REUSED_PROJECTS: ${{ needs.dotnet.outputs.reused_projects }}
      BUILD_MS: ${{ needs.dotnet.outputs.build_duration_ms }}
      UNIT_MS: ${{ needs.dotnet-unit.outputs.test_duration_ms }}
      INTEGRATION_MS: ${{ needs.dotnet-integration.outputs.test_duration_ms }}
      ANGULAR_MS: ${{ needs.angular-jest.outputs.angular_duration_ms }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      BASE_REF: ${{ inputs.base_ref }}
    steps:
      - name: Generate Pipeline Summary Report
        shell: bash
        run: |
          status() {
            case "$1" in
              success) echo "✅ Success" ;;
              skipped) echo "⏭️ Skipped (no affected suite)" ;;
              *) echo "❌ ${1:-not run}" ;;
            esac
          }
          if [ -n "$CACHE_URL" ]; then CACHE_ENDPOINT="Build cache service"; CACHE_STATE="Enabled"; else CACHE_ENDPOINT="Disabled (no CACHE_URL)"; CACHE_STATE="Off"; echo "Build Cache: disabled (no CACHE_URL)"; fi

          echo "=========================================================="
          echo "       HOMELAB CI/CD TUNING PERFORMANCE REPORT           "
          echo "=========================================================="
          echo "Runner Mode:              ${RUNNER_LABEL}"
          echo "Branch / Ref:             ${TARGET_BRANCH}"
          echo "Base Ref:                 ${BASE_REF}"
          echo "Cache nuget:              ${HIT_NUGET:-false}"
          echo "Cache dotnet-outputs:     ${RESTORED_OUTPUTS:-0/0} projects restored"
          echo "Cache node_modules:       ${HIT_NODE:-false}"
          echo "CoreCompile:              ${COMPILED_PROJECTS:-N/A} compiled, ${REUSED_PROJECTS:-N/A} reused"
          echo "Build Duration:           ${BUILD_MS:-N/A} ms"
          echo ".NET Unit Duration:       ${UNIT_MS:-N/A} ms"
          echo ".NET Integration Duration:${INTEGRATION_MS:-N/A} ms"
          echo "Angular Test Duration:    ${ANGULAR_MS:-N/A} ms"
          echo "=========================================================="

          {
            echo "## 🚀 Homelab SDET Performance & Optimization Report"
            echo ""
            echo "| Technology Stack | Target Runner | Duration | Status |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **.NET 8 Solution Build** | ${RUNNER_LABEL} | **${BUILD_MS:-0} ms**, CoreCompile ${COMPILED_PROJECTS:-0} compiled / ${REUSED_PROJECTS:-0} reused | $(status "$BUILD_RESULT") |"
            echo "| **.NET Unit Tests** | ${RUNNER_LABEL} | **${UNIT_MS:-0} ms** | $(status "$UNIT_RESULT") |"
            echo "| **.NET Integration Tests** | ${RUNNER_LABEL} | **${INTEGRATION_MS:-0} ms** | $(status "$INTEGRATION_RESULT") |"
            echo "| **Angular Jest Unit Tests** | ${RUNNER_LABEL} | **${ANGULAR_MS:-0} ms** | $(status "$ANGULAR_RESULT") |"
            echo "| **Build Cache** | ${CACHE_ENDPOINT} | nuget: \`${HIT_NUGET:-false}\`, dotnet-outputs: \`${RESTORED_OUTPUTS:-0/0}\` projects, node_modules: \`${HIT_NODE:-false}\` | ${CACHE_STATE} |"
            echo ""
            echo "### Infrastructure Execution Model"
            echo "- 🏗️ **Runner Infrastructure:** ${RUNNER_LABEL}"
            echo "- 🔄 **Routing:** ${ROUTE_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$BUILD_RESULT" "$ANGULAR_RESULT"; do [ "$result" = success ] || failed=1; done
          for result in "$UNIT_RESULT" "$INTEGRATION_RESULT"; do case "$result" in success|skipped) ;; *) failed=1 ;; esac; done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more pipeline stages failed!"
            exit 1
          fi
