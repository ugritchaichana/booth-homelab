name: Reusable SDET Pipeline

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
      force_ubuntu_runner:
        description: 'Force execution on GitHub-hosted ubuntu-latest runners'
        required: false
        type: boolean
        default: false
    outputs:
      cache_hit:
        description: 'Cache hit status'
        value: ${{ jobs.dotnet-build.outputs.cache_hit }}
      build_duration_ms:
        description: 'Build duration in ms'
        value: ${{ jobs.dotnet-build.outputs.build_duration_ms }}
      test_duration_ms:
        description: 'Test duration in ms'
        value: ${{ jobs.dotnet-test.outputs.test_duration_ms }}
      angular_duration_ms:
        description: 'Angular Jest duration in ms'
        value: ${{ jobs.angular-jest.outputs.angular_duration_ms }}

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
      force_ubuntu_runner:
        description: 'Force execution on GitHub-hosted ubuntu-latest runners'
        required: false
        type: boolean
        default: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Stage 1: Runner Telemetry
  telemetry:
    name: Telemetry
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    steps:
      - name: Inspect Runner Telemetry
        shell: bash
        run: |
          echo "=========================================================="
          echo "           RUNNER SYSTEM TELEMETRY                       "
          echo "=========================================================="
          echo "Runner Mode: ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab') && 'GitHub-Hosted (ubuntu-latest fallback)' || 'Proxmox VE Self-Hosted (LXC)' }}"
          echo "Hostname:    $(hostname)"
          echo "Kernel:      $(uname -r)"
          echo "CPU Cores:   $(nproc)"
          echo "Memory:"
          free -h
          echo "Docker Info:"
          docker --version 2>/dev/null || true
          echo ".NET SDK Version:"
          dotnet --version 2>/dev/null || true
          echo "MinIO Health Check:"
          curl -s -m 2 -I http://10.99.20.20:9000/minio/health/live 2>/dev/null | grep -E "HTTP/|Server" || echo "MinIO unreachable (Clean build fallback active)"
          echo "=========================================================="

  # Stage 2: .NET Solution Build & Remote Cache Restore
  dotnet-build:
    name: Build (.NET)
    needs: [telemetry]
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    outputs:
      cache_hit: ${{ steps.restore-cache.outputs.cache_hit }}
      build_duration_ms: ${{ steps.compile.outputs.build_duration_ms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Restore Remote MinIO Cache
        id: restore-cache
        uses: ./.github/actions/minio-cache
        with:
          mode: restore
          branch: ${{ inputs.target_branch }}

      - name: Assert .NET Cache Telemetry
        shell: bash
        env:
          RESTORE_LOG: ${{ runner.temp }}/dotnet-cache-restore.log
          REPORTED_CACHE_HIT: ${{ steps.restore-cache.outputs.cache_hit }}
        run: ./scripts/ci/assert-cache-telemetry.sh "$RESTORE_LOG" "$REPORTED_CACHE_HIT"

      - name: Compile Solution (/p:Deterministic=true)
        id: compile
        shell: bash
        run: |
          echo "==> Building .NET 8 Backend Solution..."
          BUILD_START=$(date +%s%N)
          set +e
          dotnet build apps/backend/SdetTestingRig.sln --configuration Release /p:Deterministic=true
          rc=$?
          set -e
          BUILD_MS=$(( ($(date +%s%N) - BUILD_START) / 1000000 ))
          echo "build_duration_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"
          echo "=========================================================="
          echo " [BENCHMARK] Build Time: ${BUILD_MS} ms"
          echo "=========================================================="
          exit $rc

  # Stage 3: .NET Unit & Integration Tests
  dotnet-test:
    name: Test (.NET)
    needs: [dotnet-build]
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    outputs:
      test_duration_ms: ${{ steps.run-tests.outputs.test_duration_ms }}
    steps:
      - name: Checkout Repository (Preserve Binaries)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          clean: false

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Execute Transitive Affected Tests (Unit & Integration)
        id: run-tests
        uses: ./.github/actions/run-affected-tests
        with:
          base_ref: ${{ inputs.base_ref }}
          head_ref: HEAD

      - name: Archive .NET Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-dotnet-test-results
          path: apps/backend/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  # Stage 4: .NET Cache Update & MinIO Upload
  dotnet-cache-save:
    name: Cache (.NET)
    needs: [dotnet-build, dotnet-test]
    environment: cache-writer
    if: always() && needs.dotnet-build.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    steps:
      - name: Checkout Repository (Preserve Binaries)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: false

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Configure Writer Alias
        id: writer
        shell: bash
        env:
          MC_CONFIG_DIR: ${{ runner.temp }}/mc
          WRITER_ACCESS_KEY: ${{ secrets.MINIO_WRITER_ACCESS_KEY }}
          WRITER_SECRET_KEY: ${{ secrets.MINIO_WRITER_SECRET_KEY }}
        run: |
          if [ -z "$WRITER_ACCESS_KEY" ] || [ -z "$WRITER_SECRET_KEY" ]; then
            echo "::warning::MinIO writer credentials not configured; skipping cache save."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif ! command -v mc >/dev/null 2>&1; then
            echo "::warning::mc not found on this runner; skipping cache save."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif mc alias set minio-writer http://10.99.20.20:9000 "$WRITER_ACCESS_KEY" "$WRITER_SECRET_KEY" >/dev/null 2>&1; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Writer alias setup failed; skipping cache save."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Remote MinIO Cache
        if: steps.writer.outputs.configured == 'true'
        env:
          MC_CONFIG_DIR: ${{ runner.temp }}/mc
        uses: ./.github/actions/minio-cache
        with:
          mode: save
          branch: ${{ inputs.target_branch }}
          commit_sha: ${{ github.sha }}

  # Stage 5: Angular Jest Unit Tests
  angular-jest:
    name: Test (Angular)
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "angular"]') }}
    outputs:
      angular_duration_ms: ${{ steps.run-angular.outputs.angular_duration_ms }}
      npm_cache_hit: ${{ steps.run-angular.outputs.npm_cache_hit }}
      npm_cache_key: ${{ steps.run-angular.outputs.npm_cache_key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js 22 (Fallback Runner)
        if: inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Execute Angular Jest Suite
        id: run-angular
        uses: ./.github/actions/run-angular-jest

      - name: Assert Angular Cache Telemetry
        if: always() && steps.run-angular.outcome != 'skipped'
        shell: bash
        env:
          RESTORE_LOG: ${{ runner.temp }}/angular-cache-restore.log
          REPORTED_CACHE_HIT: ${{ steps.run-angular.outputs.npm_cache_hit }}
        run: ./scripts/ci/assert-cache-telemetry.sh "$RESTORE_LOG" "$REPORTED_CACHE_HIT"

      - name: Archive Angular Coverage
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-angular-coverage
          path: apps/frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Stage 5b: Angular npm Cache Upload (writer credentials live only here)
  angular-cache-save:
    name: Cache (Angular)
    needs: [angular-jest]
    environment: cache-writer
    if: always() && needs.angular-jest.result == 'success' && needs.angular-jest.outputs.npm_cache_hit != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "angular"]') }}
    steps:
      - name: Checkout Repository (Preserve node_modules)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: false

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Configure Writer Alias
        id: writer
        shell: bash
        env:
          MC_CONFIG_DIR: ${{ runner.temp }}/mc
          WRITER_ACCESS_KEY: ${{ secrets.MINIO_WRITER_ACCESS_KEY }}
          WRITER_SECRET_KEY: ${{ secrets.MINIO_WRITER_SECRET_KEY }}
        run: |
          if [ -z "$WRITER_ACCESS_KEY" ] || [ -z "$WRITER_SECRET_KEY" ]; then
            echo "::warning::MinIO writer credentials not configured; skipping cache save."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif ! command -v mc >/dev/null 2>&1; then
            echo "::warning::mc not found on this runner; skipping cache save."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif mc alias set minio-writer http://10.99.20.20:9000 "$WRITER_ACCESS_KEY" "$WRITER_SECRET_KEY" >/dev/null 2>&1; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Writer alias setup failed; skipping cache save."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Angular npm Cache
        if: steps.writer.outputs.configured == 'true'
        shell: bash
        env:
          MC_CONFIG_DIR: ${{ runner.temp }}/mc
          NPM_CACHE_KEY: ${{ needs.angular-jest.outputs.npm_cache_key }}
        run: ./scripts/ci/save-npm-cache.sh "$NPM_CACHE_KEY"

  # Stage 6: Performance & Quality Summary Report
  summary:
    name: Report
    needs: [telemetry, dotnet-build, dotnet-test, dotnet-cache-save, angular-jest, angular-cache-save]
    if: ${{ !cancelled() }}
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    steps:
      - name: Generate Pipeline Summary Report
        shell: bash
        run: |
          CACHE_HIT="${{ needs.dotnet-build.outputs.cache_hit }}"
          BUILD_MS="${{ needs.dotnet-build.outputs.build_duration_ms }}"
          DOTNET_TEST_MS="${{ needs.dotnet-test.outputs.test_duration_ms }}"
          ANGULAR_MS="${{ needs.angular-jest.outputs.angular_duration_ms }}"
          NPM_CACHE_HIT="${{ needs.angular-jest.outputs.npm_cache_hit }}"
          NPM_CACHE_SAVE_RESULT="${{ needs.angular-cache-save.result }}"
          RUNNER_LABEL="${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab') && 'GitHub-Hosted (ubuntu-latest)' || 'Proxmox VE Self-Hosted (LXC)' }}"

          echo "=========================================================="
          echo "       HOMELAB CI/CD TUNING PERFORMANCE REPORT           "
          echo "=========================================================="
          echo "Runner Mode:          ${RUNNER_LABEL}"
          echo "Branch / Ref:         ${{ inputs.target_branch }}"
          echo "Base Ref:             ${{ inputs.base_ref }}"
          echo ".NET Cache Hit:       ${CACHE_HIT:-false}"
          echo "npm Cache Hit:        ${NPM_CACHE_HIT:-false}"
          echo "Build Duration:       ${BUILD_MS:-N/A} ms"
          echo ".NET Test Duration:   ${DOTNET_TEST_MS:-N/A} ms"
          echo "Angular Test Duration:${ANGULAR_MS:-N/A} ms"
          echo "=========================================================="

          # Write GitHub Step Summary
          {
            echo "## 🚀 Homelab SDET Performance & Optimization Report"
            echo ""
            echo "| Technology Stack | Target Runner | Duration | Status |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **.NET 8 Solution Build** | ${RUNNER_LABEL} | **${BUILD_MS:-0} ms** | ${{ needs.dotnet-build.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **.NET Unit & Integration Tests** | ${RUNNER_LABEL} | **${DOTNET_TEST_MS:-0} ms** | ${{ needs.dotnet-test.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **Angular Jest Unit Tests** | ${RUNNER_LABEL} | **${ANGULAR_MS:-0} ms** | ${{ needs.angular-jest.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **MinIO cache restore (.NET)** | Virtual Bus (\`10.99.20.20:9000\`) | - | Hit: \`${CACHE_HIT:-false}\` |"
            echo "| **MinIO cache restore (npm)** | Virtual Bus (\`10.99.20.20:9000\`) | - | Hit: \`${NPM_CACHE_HIT:-false}\` |"
            echo "| **MinIO cache save (npm)** | Virtual Bus (\`10.99.20.20:9000\`) | - | ${NPM_CACHE_SAVE_RESULT:-skipped} |"
            echo ""
            echo "### Infrastructure Execution Model"
            echo "- 🏗️ **Runner Infrastructure:** ${RUNNER_LABEL}"
            echo "- **Runner selection:** Forks and manual \`force_ubuntu_runner\` dispatches run on ubuntu-latest. There is no automatic fallback when the self-hosted runners are offline."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.dotnet-build.result }}" != "success" ] || [ "${{ needs.dotnet-test.result }}" != "success" ] || [ "${{ needs.angular-jest.result }}" != "success" ]; then
            echo "::error::One or more pipeline stages failed!"
            exit 1
          fi
