name: Reusable SDET Pipeline

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
      force_ubuntu_runner:
        description: 'Force execution on GitHub-hosted ubuntu-latest runners'
        required: false
        type: boolean
        default: false
    outputs:
      cache_hit:
        description: 'Cache hit status'
        value: ${{ jobs.dotnet-build.outputs.cache_hit }}
      build_duration_ms:
        description: 'Build duration in ms'
        value: ${{ jobs.dotnet-build.outputs.build_duration_ms }}
      test_duration_ms:
        description: 'Test duration in ms'
        value: ${{ jobs.dotnet-test.outputs.test_duration_ms }}
      angular_duration_ms:
        description: 'Angular Jest duration in ms'
        value: ${{ jobs.angular-jest.outputs.angular_duration_ms }}

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch name for cache scoping'
        required: false
        type: string
        default: 'master'
      base_ref:
        description: 'Base git reference for diff calculation'
        required: false
        type: string
        default: 'origin/master'
      force_ubuntu_runner:
        description: 'Force execution on GitHub-hosted ubuntu-latest runners'
        required: false
        type: boolean
        default: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CACHE_URL: ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab') && '' || 'http://10.99.17.10:8080' }}
  BUILD_CACHE_RUNNER_CLASS: ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab') && '' || 'lxc-runner' }}

jobs:
  # Stage 1: Runner Telemetry
  telemetry:
    name: Telemetry
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    steps:
      - name: Inspect Runner Telemetry
        shell: bash
        run: |
          echo "=========================================================="
          echo "           RUNNER SYSTEM TELEMETRY                       "
          echo "=========================================================="
          echo "Runner Mode: ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab') && 'GitHub-Hosted (ubuntu-latest fallback)' || 'Proxmox VE Self-Hosted (LXC)' }}"
          echo "Hostname:    $(hostname)"
          echo "Kernel:      $(uname -r)"
          echo "CPU Cores:   $(nproc)"
          echo "Memory:"
          free -h
          echo "Docker Info:"
          docker --version 2>/dev/null || true
          echo ".NET SDK Version:"
          dotnet --version 2>/dev/null || true
          if [ -n "$CACHE_URL" ]; then
            echo "Build Cache Status:"
            curl -s -m 2 "$CACHE_URL/status" || echo "Build cache unreachable (cold build fallback active)"
            echo ""
          fi
          echo "=========================================================="

  # Stage 2: .NET Solution Build & Build Cache Restore
  dotnet-build:
    name: Build (.NET)
    needs: [telemetry]
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    outputs:
      cache_hit: ${{ steps.restore-outputs.outputs.hit }}
      cache_hit_nuget: ${{ steps.restore-nuget.outputs.hit }}
      cache_hit_dotnet_outputs: ${{ steps.restore-outputs.outputs.hit }}
      build_duration_ms: ${{ steps.compile.outputs.build_duration_ms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Restore NuGet Cache
        id: restore-nuget
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          kind: nuget
          stats-file: ${{ runner.temp }}/build-cache-stats.jsonl

      - name: Restore NuGet Packages (Locked)
        shell: bash
        run: dotnet restore apps/backend/SdetTestingRig.sln --locked-mode

      - name: Restore Build Outputs Cache
        id: restore-outputs
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          kind: dotnet-outputs
          stats-file: ${{ runner.temp }}/build-cache-stats.jsonl

      - name: Compile Solution (/p:Deterministic=true)
        id: compile
        shell: bash
        run: |
          echo "==> Building .NET 8 Backend Solution..."
          BUILD_START=$(date +%s%N)
          set +e
          dotnet build apps/backend/SdetTestingRig.sln --configuration Release --no-restore /p:Deterministic=true
          rc=$?
          set -e
          BUILD_MS=$(( ($(date +%s%N) - BUILD_START) / 1000000 ))
          echo "build_duration_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"
          echo "=========================================================="
          echo " [BENCHMARK] Build Time: ${BUILD_MS} ms"
          echo "=========================================================="
          exit $rc

      - name: Pack Cache Payloads
        if: ${{ always() && steps.compile.outcome == 'success' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-payload"
          tar -C "$NUGET_PACKAGES" -cf "$RUNNER_TEMP/cache-payload/nuget.tar" .
          find apps/backend apps/fixtures -type d \( -name bin -o -name obj \) -prune -print0             | tar --null -T - -cf "$RUNNER_TEMP/cache-payload/dotnet-outputs.tar"

      - name: Upload Cache Payloads
        if: ${{ always() && steps.compile.outcome == 'success' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cache-payload-dotnet
          path: ${{ runner.temp }}/cache-payload/
          retention-days: 1
          if-no-files-found: error

      - name: Cache Hit Report
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/build-cache-stats.jsonl" ]; then
            PYTHONPATH=scripts/ci python3 -m build_cache report --stats-file "$RUNNER_TEMP/build-cache-stats.jsonl"
          fi

  # Stage 3: .NET Unit & Integration Tests
  dotnet-test:
    name: Test (.NET)
    needs: [dotnet-build]
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    outputs:
      test_duration_ms: ${{ steps.run-tests.outputs.test_duration_ms }}
    steps:
      - name: Checkout Repository (Preserve Binaries)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          clean: false

      - name: Setup .NET 8 SDK (Fallback Runner)
        if: inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Execute Transitive Affected Tests (Unit & Integration)
        id: run-tests
        uses: ./.github/actions/run-affected-tests
        with:
          base_ref: ${{ inputs.base_ref }}
          head_ref: HEAD

      - name: Archive .NET Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-dotnet-test-results
          path: apps/backend/TestResults/
          retention-days: 7
          if-no-files-found: ignore

  # Stage 4: .NET Cache Update (writer job: no third-party code runs here)
  dotnet-cache-save:
    name: Cache (.NET)
    needs: [dotnet-build, dotnet-test]
    environment: cache-writer
    if: always() && needs.dotnet-build.result == 'success' && !inputs.force_ubuntu_runner && github.repository == 'ugritchaichana/booth-homelab' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Cache Payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cache-payload-dotnet
          path: ${{ runner.temp }}/cache-payload

      - name: Unpack Cache Payloads
        shell: bash
        run: |
          mkdir -p "$NUGET_PACKAGES"
          tar -C "$NUGET_PACKAGES" -xf "$RUNNER_TEMP/cache-payload/nuget.tar"
          tar -xf "$RUNNER_TEMP/cache-payload/dotnet-outputs.tar"

      - name: Save NuGet Cache
        uses: ./.github/actions/build-cache
        env:
          CACHE_WRITER_PASSWORD: ${{ secrets.CACHE_WRITER_PASSWORD }}
          BUILD_CACHE_WRITER_TOKEN: '1'
        with:
          mode: save
          kind: nuget

      - name: Save Build Outputs Cache
        uses: ./.github/actions/build-cache
        env:
          CACHE_WRITER_PASSWORD: ${{ secrets.CACHE_WRITER_PASSWORD }}
          BUILD_CACHE_WRITER_TOKEN: '1'
        with:
          mode: save
          kind: dotnet-outputs

  # Stage 4b: Angular dependency cache update (writer job: no third-party code runs here)
  angular-cache-save:
    name: Cache (Angular)
    needs: [angular-jest]
    environment: cache-writer
    if: always() && needs.angular-jest.result == 'success' && !inputs.force_ubuntu_runner && github.repository == 'ugritchaichana/booth-homelab' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "angular"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Cache Payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cache-payload-node-modules
          path: ${{ runner.temp }}/cache-payload

      - name: Unpack Cache Payload
        shell: bash
        run: tar -C apps/frontend -xf "$RUNNER_TEMP/cache-payload/node_modules.tar"

      - name: Save node_modules Cache
        uses: ./.github/actions/build-cache
        env:
          CACHE_WRITER_PASSWORD: ${{ secrets.CACHE_WRITER_PASSWORD }}
          BUILD_CACHE_WRITER_TOKEN: '1'
        with:
          mode: save
          kind: node_modules

  # Stage 5: Angular Jest Unit Tests
  angular-jest:
    name: Test (Angular)
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "angular"]') }}
    outputs:
      angular_duration_ms: ${{ steps.run-angular.outputs.angular_duration_ms }}
      cache_hit_node_modules: ${{ steps.run-angular.outputs.cache_hit_node_modules }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js 22 (Fallback Runner)
        if: inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'

      - name: Ensure Executable Permissions
        shell: bash
        run: chmod +x ./scripts/ci/*.sh ./scripts/apps/*.sh 2>/dev/null || true

      - name: Execute Angular Jest Suite
        id: run-angular
        uses: ./.github/actions/run-angular-jest

      - name: Pack node_modules Payload
        if: ${{ steps.run-angular.outputs.cache_hit_node_modules != 'true' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-payload"
          tar -C apps/frontend -cf "$RUNNER_TEMP/cache-payload/node_modules.tar" node_modules

      - name: Upload node_modules Payload
        if: ${{ steps.run-angular.outputs.cache_hit_node_modules != 'true' && env.CACHE_URL != '' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cache-payload-node-modules
          path: ${{ runner.temp }}/cache-payload/
          retention-days: 1
          if-no-files-found: error

      - name: Archive Angular Coverage
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sdet-angular-coverage
          path: apps/frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Stage 6: Performance & Quality Summary Report
  summary:
    name: Report
    needs: [telemetry, dotnet-build, dotnet-test, dotnet-cache-save, angular-cache-save, angular-jest]
    if: ${{ !cancelled() }}
    runs-on: >
      ${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab')
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["self-hosted", "linux", "proxmox", "dotnet"]') }}
    steps:
      - name: Generate Pipeline Summary Report
        shell: bash
        run: |
          HIT_NUGET="${{ needs.dotnet-build.outputs.cache_hit_nuget }}"
          HIT_OUTPUTS="${{ needs.dotnet-build.outputs.cache_hit_dotnet_outputs }}"
          HIT_NODE="${{ needs.angular-jest.outputs.cache_hit_node_modules }}"
          BUILD_MS="${{ needs.dotnet-build.outputs.build_duration_ms }}"
          DOTNET_TEST_MS="${{ needs.dotnet-test.outputs.test_duration_ms }}"
          ANGULAR_MS="${{ needs.angular-jest.outputs.angular_duration_ms }}"
          RUNNER_LABEL="${{ (inputs.force_ubuntu_runner || github.repository != 'ugritchaichana/booth-homelab') && 'GitHub-Hosted (ubuntu-latest)' || 'Proxmox VE Self-Hosted (LXC)' }}"

          if [ -n "$CACHE_URL" ]; then CACHE_ENDPOINT="Build cache service"; CACHE_STATE="Enabled"; else CACHE_ENDPOINT="Disabled (no CACHE_URL)"; CACHE_STATE="Off"; fi

          echo "=========================================================="
          echo "       HOMELAB CI/CD TUNING PERFORMANCE REPORT           "
          echo "=========================================================="
          echo "Runner Mode:          ${RUNNER_LABEL}"
          echo "Branch / Ref:         ${{ inputs.target_branch }}"
          echo "Base Ref:             ${{ inputs.base_ref }}"
          echo "Cache nuget:          ${HIT_NUGET:-false}"
          echo "Cache dotnet-outputs: ${HIT_OUTPUTS:-false}"
          echo "Cache node_modules:   ${HIT_NODE:-false}"
          echo "Build Duration:       ${BUILD_MS:-N/A} ms"
          echo ".NET Test Duration:   ${DOTNET_TEST_MS:-N/A} ms"
          echo "Angular Test Duration:${ANGULAR_MS:-N/A} ms"
          echo "=========================================================="

          # Write GitHub Step Summary
          {
            echo "## 🚀 Homelab SDET Performance & Optimization Report"
            echo ""
            echo "| Technology Stack | Target Runner | Duration | Status |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **.NET 8 Solution Build** | ${RUNNER_LABEL} | **${BUILD_MS:-0} ms** | ${{ needs.dotnet-build.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **.NET Unit & Integration Tests** | ${RUNNER_LABEL} | **${DOTNET_TEST_MS:-0} ms** | ${{ needs.dotnet-test.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **Angular Jest Unit Tests** | ${RUNNER_LABEL} | **${ANGULAR_MS:-0} ms** | ${{ needs.angular-jest.result == 'success' && '✅ Success' || '❌ Failed' }} |"
            echo "| **Build Cache** | ${CACHE_ENDPOINT} | nuget: \`${HIT_NUGET:-false}\`, dotnet-outputs: \`${HIT_OUTPUTS:-false}\`, node_modules: \`${HIT_NODE:-false}\` | ${CACHE_STATE} |"
            echo ""
            echo "### Infrastructure Execution Model"
            echo "- 🏗️ **Runner Infrastructure:** ${RUNNER_LABEL}"
            echo "- 🔄 **Graceful Fallback:** Fork-safe automatic degradation to GitHub-hosted runners when self-hosted infrastructure is unreachable."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.dotnet-build.result }}" != "success" ] || [ "${{ needs.dotnet-test.result }}" != "success" ] || [ "${{ needs.angular-jest.result }}" != "success" ]; then
            echo "::error::One or more pipeline stages failed!"
            exit 1
          fi
