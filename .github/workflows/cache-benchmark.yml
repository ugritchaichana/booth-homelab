name: Build Cache Benchmark

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to measure'
        type: choice
        options: [proxmox, hosted]
        default: proxmox
      projects:
        description: 'Projects in the generated reference chain'
        type: string
        default: '24'
      rounds:
        description: 'Rounds per scenario (the median is reported)'
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  bench:
    name: Large-solution benchmark
    runs-on: ${{ inputs.runner == 'proxmox' && fromJSON('["self-hosted", "proxmox", "dotnet"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET 8 SDK (Hosted)
        if: inputs.runner == 'hosted'
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.13 (Hosted)
        if: inputs.runner == 'hosted'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Measure Per-Project Output Reuse
        env:
          BENCH_PROJECTS: ${{ inputs.projects }}
          BENCH_ROUNDS: ${{ inputs.rounds }}
        run: bash tests/cache/bench_large_solution.sh
