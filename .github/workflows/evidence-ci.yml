name: Evidence Publisher Gate

on:
  push:
    branches: [ master, main ]
    paths:
      - 'docs/evidence/**'
      - 'docs/knowledge/**'
      - 'scripts/evidence/**'
      - 'tests/evidence/**'
      - 'tests/requirements-coverage-ci.txt'
      - '.github/workflows/evidence-ci.yml'
  pull_request:
    paths:
      - 'docs/evidence/**'
      - 'docs/knowledge/**'
      - 'scripts/evidence/**'
      - 'tests/evidence/**'
      - 'tests/requirements-coverage-ci.txt'
      - '.github/workflows/evidence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    name: Evidence Publisher Tests & Published-Text Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install coverage.py
        run: python -m pip install --require-hashes -r tests/requirements-coverage-ci.txt

      - name: Run the Publisher and Checker Unit Tests, Measured
        run: |
          coverage run --branch --source=scripts/evidence -m unittest discover -s tests/evidence -v
          coverage report -m --precision=2 --fail-under=94

      - name: Print the Line and Branch Split
        run: |
          coverage json -o - | python3 -c 'import json,sys; t=json.load(sys.stdin)["totals"]; print("lines %.2f%% (%d of %d), branches %.2f%% (%d of %d)" % (100*t["covered_lines"]/t["num_statements"], t["covered_lines"], t["num_statements"], 100*t["covered_branches"]/t["num_branches"], t["covered_branches"], t["num_branches"]))'

      - name: Check Published Evidence and Knowledge Text
        run: python scripts/evidence/publish.py --check docs/evidence docs/knowledge --allow-addresses-from iac
