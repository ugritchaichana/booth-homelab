name: Evidence Publisher Gate

on:
  push:
    branches: [ master, main ]
    paths:
      - 'docs/evidence/**'
      - 'docs/knowledge/**'
      - 'scripts/evidence/**'
      - 'tests/evidence/**'
      - '.github/workflows/evidence-ci.yml'
  pull_request:
    paths:
      - 'docs/evidence/**'
      - 'docs/knowledge/**'
      - 'scripts/evidence/**'
      - 'tests/evidence/**'
      - '.github/workflows/evidence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    name: Evidence Publisher Tests & Published-Text Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run the Publisher and Checker Unit Tests
        run: python -m unittest discover -s tests/evidence -v

      - name: Check Published Evidence and Knowledge Text
        run: python scripts/evidence/publish.py --check docs/evidence docs/knowledge --allow-addresses-from iac --allow-addresses-from tests
