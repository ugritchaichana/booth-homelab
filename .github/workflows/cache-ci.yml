name: Cache client CI

on:
  pull_request:
    paths:
      - 'scripts/ci/build_cache/**'
      - 'tests/cache/**'
      - '.github/workflows/reusable-sdet-pipeline.yml'
      - 'apps/**'
      - '.github/workflows/cache-ci.yml'
  push:
    paths:
      - 'scripts/ci/build_cache/**'
      - 'tests/cache/**'
      - '.github/workflows/reusable-sdet-pipeline.yml'
      - 'apps/**'
      - '.github/workflows/cache-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-and-lockfiles:
    name: Client tests, lockfiles, stale-binary test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'

      - name: Install PyYAML
        run: python3 -m pip install --require-hashes -r tests/cache/requirements-ci.txt

      - name: Unit tests and dependency rule
        run: python3 -m unittest discover -s tests/cache -p 'test_*.py' -v

      - name: NuGet restore in locked mode
        run: dotnet restore apps/backend/SdetTestingRig.sln --locked-mode

      - name: npm ci
        working-directory: apps/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Stale-binary test
        run: bash tests/cache/test_stale_binaries.sh
