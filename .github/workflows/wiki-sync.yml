name: Synchronize Wiki Knowledge Base

on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
      - 'scripts/ci/sync_wiki.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Synchronize Documentation Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          status=0
          python3 scripts/ci/sync_wiki.py || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::wiki repository not initialised; create its first page in the web UI"
            exit 0
          fi
          exit "$status"
