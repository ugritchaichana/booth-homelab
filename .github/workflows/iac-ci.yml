name: IaC Governance & Quality Gate

on:
  push:
    branches: [ master, main ]
    paths:
      - 'iac/**'
      - 'tests/isolation/**'
      - '.github/workflows/iac-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'iac/**'
      - 'tests/isolation/**'
      - '.github/workflows/iac-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu-quality-gate:
    name: OpenTofu Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Shared Stack Files Are Identical
        run: |
          status=0
          for name in encryption.tf providers.tf versions.tf; do
            files=(iac/tofu/stacks/*/"$name")
            if [ ! -e "${files[0]}" ] || [ "${#files[@]}" -lt 2 ]; then
              echo "::error::fewer than two stacks hold $name under iac/tofu/stacks"
              status=1
              continue
            fi
            for file in "${files[@]:1}"; do
              if ! diff -u "${files[0]}" "$file"; then
                echo "::error file=$file::differs from ${files[0]}"
                status=1
              fi
            done
          done
          exit "$status"

      - name: Setup OpenTofu CLI
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Verify Formatting (tofu fmt -check)
        run: |
          echo "==> Checking OpenTofu code formatting across all modules..."
          tofu fmt -check -recursive iac/tofu

      - name: Install tflint v0.64.0
        run: |
          curl -fsSL --retry 3 -o tflint_linux_amd64.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          echo "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537  tflint_linux_amd64.zip" | sha256sum -c -
          unzip -q tflint_linux_amd64.zip tflint -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/tflint" --version

      - name: Lint Every Stack (tflint)
        working-directory: iac/tofu/stacks
        run: '"$RUNNER_TEMP/tflint" --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"'

      - name: Initialize, Validate and Test Every Root Module
        env:
          TF_VAR_state_passphrase: ci-test-only-passphrase-not-a-secret-0123456789
        run: |
          roots=$(find iac/tofu -name '*.tf' -not -path '*/modules/*' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          if [ -z "$roots" ]; then
            echo "::error::no OpenTofu root module found under iac/tofu"
            exit 1
          fi
          for dir in $roots; do
            echo "==> Validating $dir"
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
            tofu -chdir="$dir" test
          done

  ansible-quality-gate:
    name: Ansible Lint, Syntax & Molecule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the Hash-Pinned Ansible Toolchain
        run: python -m pip install --require-hashes -r iac/ansible/requirements-ci.txt

      - name: Install Pinned Collections
        run: ansible-galaxy collection install -r iac/ansible/requirements.yml

      - name: Lint (production profile)
        run: ansible-lint --profile production iac/ansible

      - name: Syntax-Check Every Playbook
        run: |
          count=0
          for playbook in iac/ansible/playbooks/*.yml; do
            [ -e "$playbook" ] || continue
            echo "==> Syntax-checking $playbook"
            ANSIBLE_CONFIG=iac/ansible/ansible.cfg ansible-playbook --syntax-check "$playbook"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no playbook found under iac/ansible/playbooks"
            exit 1
          fi

      - name: Run the Isolation Render Tests
        run: |
          count=0
          for test in tests/isolation/test-*.sh; do
            [ -e "$test" ] || continue
            echo "==> Running $test"
            bash "$test"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no isolation test found under tests/isolation"
            exit 1
          fi

      - name: Molecule Converge, Idempotence and Verify (base role)
        working-directory: iac/ansible/roles/base
        run: molecule test
