name: Secret Scan

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan commits added by this event
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              LOG_OPTS="$BASE_SHA..$HEAD_SHA"
              ;;
            push)
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                LOG_OPTS="-1 $PUSH_SHA"
              else
                LOG_OPTS="$BEFORE_SHA..$PUSH_SHA"
              fi
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          ./gitleaks git --no-banner --redact=100 --exit-code 1 --log-opts="$LOG_OPTS" .
