name: 'Angular Jest Unit Test Runner'
description: 'Restores the node_modules cache and executes Angular Jest tests on Proxmox CT 103'

outputs:
  angular_duration_ms:
    description: 'Execution duration in milliseconds'
    value: ${{ steps.exec-angular.outputs.angular_duration_ms }}

  cache_hit_node_modules:
    description: 'true when node_modules was restored from the build cache'
    value: ${{ steps.exec-angular.outputs.cache_hit_node_modules }}

runs:
  using: 'composite'
  steps:
    - name: Run Angular Jest
      id: exec-angular
      shell: bash
      run: |
        chmod +x ./scripts/apps/run-angular-jest.sh
        START=$(date +%s%N)
        set +e
        ./scripts/apps/run-angular-jest.sh
        rc=$?
        set -e
        DURATION=$(( ($(date +%s%N) - START) / 1000000 ))
        echo "angular_duration_ms=${DURATION}" >> "$GITHUB_OUTPUT"
        exit $rc
