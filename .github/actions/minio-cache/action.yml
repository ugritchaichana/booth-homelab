name: 'MinIO Deep Optimization Cache'
description: 'Restores or saves deep optimization build cache to/from Proxmox MinIO S3'
inputs:
  mode:
    description: 'Operation mode: restore or save'
    required: true
  branch:
    description: 'Target branch name'
    required: true
  commit_sha:
    description: 'Commit SHA (required for save mode)'
    required: false
    default: ''

outputs:
  cache_hit:
    description: 'Whether cache was hit during restore'
    value: ${{ steps.cache-op.outputs.cache_hit }}

runs:
  using: 'composite'
  steps:
    - name: Execute MinIO Cache Operation
      id: cache-op
      shell: bash
      run: |
        if [ "${{ inputs.mode }}" = "restore" ]; then
          echo "[*] Restoring MinIO S3 cache for branch: ${{ inputs.branch }}"
          set -o pipefail
          ./scripts/ci/cache-restore.sh "${{ inputs.branch }}" 2>&1 | tee "${RUNNER_TEMP}/dotnet-cache-restore.log"
        elif [ "${{ inputs.mode }}" = "save" ]; then
          echo "[*] Saving MinIO S3 cache for branch: ${{ inputs.branch }} (Commit: ${{ inputs.commit_sha }})"
          ./scripts/ci/cache-save.sh "${{ inputs.branch }}" "${{ inputs.commit_sha }}"
        else
          echo "[ERROR] Unknown mode: ${{ inputs.mode }}"
          exit 1
        fi
