name: 'Setup SDET Environment'
description: 'Prepares workspace, permissions, and toolchains for SDET Homelab runs'
inputs:
  fetch-depth:
    description: 'Git fetch depth'
    required: false
    default: '0'
  clean:
    description: 'Whether to clean untracked files during checkout'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        clean: ${{ inputs.clean }}

    - name: Ensure Executable Permissions
      shell: bash
      run: |
        chmod +x ./scripts/ci/*.sh ./scripts/sdet/*.sh 2>/dev/null || true
