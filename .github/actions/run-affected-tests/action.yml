name: 'Transitive Affected Test Selection'
description: 'Computes changed files and lists the affected unit and integration test projects, without running them'
inputs:
  base_ref:
    description: 'Base git reference to diff against'
    required: true
  head_ref:
    description: 'Head git reference'
    required: false
    default: 'HEAD'
  list-dir:
    description: 'Directory that receives affected-unit.txt and affected-integration.txt, one project path per line'
    required: true

outputs:
  unit_count:
    description: 'Number of affected unit test projects'
    value: ${{ steps.select.outputs.unit_count }}
  integration_count:
    description: 'Number of affected integration test projects'
    value: ${{ steps.select.outputs.integration_count }}

runs:
  using: 'composite'
  steps:
    - name: Select Affected Tests
      id: select
      shell: bash
      env:
        BASE_REF: ${{ inputs.base_ref }}
        HEAD_REF: ${{ inputs.head_ref }}
        LIST_DIR: ${{ inputs.list-dir }}
      run: |
        mkdir -p "$LIST_DIR"
        AFFECTED_LIST_FILE="$LIST_DIR/affected.txt" ./scripts/apps/dotnet-affected-test.sh "$BASE_REF" "$HEAD_REF"
        grep -E 'IntegrationTests\.csproj$' "$LIST_DIR/affected.txt" > "$LIST_DIR/affected-integration.txt" || true
        grep -vE 'IntegrationTests\.csproj$' "$LIST_DIR/affected.txt" > "$LIST_DIR/affected-unit.txt" || true
        echo "unit_count=$(grep -c . "$LIST_DIR/affected-unit.txt" || true)" >> "$GITHUB_OUTPUT"
        echo "integration_count=$(grep -c . "$LIST_DIR/affected-integration.txt" || true)" >> "$GITHUB_OUTPUT"
