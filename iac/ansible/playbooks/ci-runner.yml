---
- name: Register one runner per test kind, each in its own container, behind the job-start guard
  hosts: pve_hosts
  gather_facts: false
  become: true
  vars:
    ci_runner_repository: ugritchaichana/booth-homelab
    ci_runner_roles: [workspace-unit-auto, dotnet-unit-auto, dotnet-integration-auto]
    ci_runner_instance: 1
    ci_runner_dir: /opt/actions-runner
    ci_runner_guard: /usr/local/lib/homelab/runner-guard.sh
    ci_runner_job_completed: /usr/local/lib/homelab/runner-job-completed.sh
    ci_runner_restart: /usr/local/lib/homelab/runner-restart.sh
    ci_runner_files:
      - {src: runner-guard.sh, dest: /usr/local/lib/homelab/runner-guard.sh, mode: "0755"}
      - {src: runner-job-completed.sh, dest: /usr/local/lib/homelab/runner-job-completed.sh, mode: "0755"}
      - {src: runner-restart.sh, dest: /usr/local/lib/homelab/runner-restart.sh, mode: "0755"}
      - {src: actions-runner@.service, dest: /etc/systemd/system/actions-runner@.service, mode: "0644"}
      - {src: actions-runner-restart@.path, dest: /etc/systemd/system/actions-runner-restart@.path, mode: "0644"}
      - {src: actions-runner-restart@.service, dest: /etc/systemd/system/actions-runner-restart@.service, mode: "0644"}
    ci_runner_stage: /root/ci-runner
    ci_runner_api: "https://api.github.com/repos/{{ ci_runner_repository }}/actions/runners"
    ci_github_token: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') }}"
    ci_github_headers:
      Authorization: "Bearer {{ ci_github_token }}"
      Accept: application/vnd.github+json
  tasks:
    - name: Require a GitHub token in the environment of the controller
      ansible.builtin.assert:
        that: ci_github_token | length > 0
        fail_msg: export GH_TOKEN for an account that administers {{ ci_runner_repository }}
        quiet: true
      no_log: true

    - name: Stage the guard and the unit on the host
      ansible.builtin.file:
        path: "{{ ci_runner_stage }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy the runner scripts to the host
      ansible.builtin.copy:
        src: "../../../scripts/ci/{{ item }}"
        dest: "{{ ci_runner_stage }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: [runner-guard.sh, runner-job-completed.sh, runner-restart.sh]

    - name: Render the runner units on the host
      ansible.builtin.template:
        src: "templates/{{ item }}.j2"
        dest: "{{ ci_runner_stage }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [actions-runner@.service, actions-runner-restart@.path, actions-runner-restart@.service]

    - name: Hash the staged files
      ansible.builtin.command:
        argv: "{{ ['sha256sum'] + (ci_runner_files | map(attribute='src') | map('regex_replace', '^', ci_runner_stage ~ '/') | list) }}"
      register: ci_staged
      changed_when: false

    - name: Converge the runner of each test kind in its own container
      ansible.builtin.include_tasks: tasks/ci-runner-role.yml
      loop: "{{ ci_runner_roles }}"
      loop_control:
        loop_var: ci_runner_role

    - name: Wait until GitHub lists the runner of every test kind online
      ansible.builtin.uri:
        url: "{{ ci_runner_api }}"
        headers: "{{ ci_github_headers }}"
      register: ci_runners
      delegate_to: localhost
      become: false
      until: >-
        ci_runners.json.runners | selectattr('name', 'in', ci_runner_roles | map('regex_replace', '^', inventory_hostname ~ '-') | list)
        | selectattr('status', 'equalto', 'online') | list | length == ci_runner_roles | length
      retries: 18
      delay: 10
      no_log: true

    - name: Show the runners as GitHub sees them
      ansible.builtin.debug:
        msg: "{{ ci_runners.json.runners | map(attribute='name') | zip(ci_runners.json.runners | map(attribute='status')) | list }}"
