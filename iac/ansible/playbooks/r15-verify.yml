---
- name: Create the control key the probe guests trust
  hosts: pve_hosts
  gather_facts: false
  become: true
  tags: [r15_keygen, never]
  vars_files:
    - ../../tofu/stacks/r15-probe/probe.yml
  tasks:
    - name: Generate the throwaway control key on the host
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, r15-probe, -f, "{{ r15_control_key }}"]
        creates: "{{ r15_control_key }}"

    - name: Read the public key
      ansible.builtin.command:
        argv: [cat, "{{ r15_control_key }}.pub"]
      register: r15_public_key
      changed_when: false

    - name: Create the snippet directory on storage local
      ansible.builtin.file:
        path: "{{ r15_snippet_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Write the vendor data that opens the control channel on the probe VM clone
      ansible.builtin.copy:
        content: |
          #cloud-config
          runcmd:
            - install -d -m 0700 -o {{ r15_guests.vm.login_user }} -g {{ r15_guests.vm.login_user }} /home/{{ r15_guests.vm.login_user }}/.ssh
            - echo '{{ r15_public_key.stdout }}' > /home/{{ r15_guests.vm.login_user }}/.ssh/authorized_keys
            - chown {{ r15_guests.vm.login_user }}:{{ r15_guests.vm.login_user }} /home/{{ r15_guests.vm.login_user }}/.ssh/authorized_keys
            - chmod 0600 /home/{{ r15_guests.vm.login_user }}/.ssh/authorized_keys
            - ssh-keygen -A
            - systemctl enable --now ssh.service
        dest: "{{ r15_snippet_dir }}/{{ r15_vendor_snippet }}"
        mode: "0644"
        owner: root
        group: root

    - name: Show the public key to pass to the r15-probe stack
      ansible.builtin.debug:
        msg: "TF_VAR_probe_ssh_public_key='{{ r15_public_key.stdout }}'"

- name: Verify the R15 isolation controls from inside the probe guests
  hosts: pve_hosts
  gather_facts: false
  become: true
  vars_files:
    - ../../tofu/stacks/r15-probe/probe.yml
    - ../../policy/runner-class.yml
  vars:
    r15_phases: [baseline, after-pct-reboot, after-pve-reboot, after-host-reboot, red-first]
    r15_probe_script: "{{ playbook_dir }}/../../../tests/isolation/r15-probe.sh"
    r15_targets_file: "{{ playbook_dir }}/../../../tests/isolation/targets.env"
    r15_work_dir: /var/lib/homelab/r15
    r15_guest_dir: /tmp/r15
    r15_guard_unit: homelab-r15-firewall-guard
    r15_guard_minutes: 10
    r15_probe_timeout: 300
    r15_ssh_base:
      - ssh
      - -i
      - "{{ r15_control_key }}"
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - ServerAliveInterval=5
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ r15_work_dir }}/known_hosts"
  tasks:
    - name: Require one host, a known phase and an output directory
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - r15_phase is defined
          - r15_phase in r15_phases
          - r15_output_dir is defined
          - r15_output_dir | length > 0
        fail_msg: >-
          Run with --limit <host> -e r15_phase=<baseline|after-pct-reboot|after-pve-reboot|after-host-reboot|red-first>
          -e r15_output_dir=<directory on this machine>

    - name: Find the uncommitted targets file
      ansible.builtin.stat:
        path: "{{ r15_targets_file }}"
      delegate_to: localhost
      become: false
      register: r15_targets_stat

    - name: Require the targets file
      ansible.builtin.assert:
        that: r15_targets_stat.stat.exists
        fail_msg: Copy tests/isolation/targets.example.env to targets.env and fill in the real targets

    - name: Create the working directory on the host
      ansible.builtin.file:
        path: "{{ r15_work_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Forget guest host keys left by an earlier apply
      ansible.builtin.file:
        path: "{{ r15_work_dir }}/known_hosts"
        state: absent
      when: r15_phase == 'baseline'

    - name: Read the state of each probe guest
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ pve_node_name }}/{{ r15_guest.value.kind }}/{{ r15_guest.value.vm_id }}/status/current"
          - --output-format
          - json
      loop: "{{ r15_guests | dict2items }}"
      loop_control:
        loop_var: r15_guest
        label: "{{ r15_guest.key }}"
      register: r15_status
      changed_when: false

    - name: Check the declared policy on every guest before any of them starts
      block:
        - name: Read the firewall options of each guest
          ansible.builtin.command:
            argv:
              - pvesh
              - get
              - "/nodes/{{ pve_node_name }}/{{ r15_guest.value.kind }}/{{ r15_guest.value.vm_id }}/firewall/options"
              - --output-format
              - json
          loop: "{{ r15_guests | dict2items }}"
          loop_control:
            loop_var: r15_guest
            label: "{{ r15_guest.key }}"
          register: r15_live_options
          changed_when: false

        - name: Read the firewall rules of each guest
          ansible.builtin.command:
            argv:
              - pvesh
              - get
              - "/nodes/{{ pve_node_name }}/{{ r15_guest.value.kind }}/{{ r15_guest.value.vm_id }}/firewall/rules"
              - --output-format
              - json
          loop: "{{ r15_guests | dict2items }}"
          loop_control:
            loop_var: r15_guest
            label: "{{ r15_guest.key }}"
          register: r15_live_rules
          changed_when: false

        - name: Read the configuration of each guest
          ansible.builtin.command:
            argv:
              - pvesh
              - get
              - "/nodes/{{ pve_node_name }}/{{ r15_guest.value.kind }}/{{ r15_guest.value.vm_id }}/config"
              - --output-format
              - json
          loop: "{{ r15_guests | dict2items }}"
          loop_control:
            loop_var: r15_guest
            label: "{{ r15_guest.key }}"
          register: r15_live_config
          changed_when: false

        - name: Read the source-address filter of the VM
          ansible.builtin.command:
            argv:
              - pvesh
              - get
              - "/nodes/{{ pve_node_name }}/qemu/{{ r15_guests.vm.vm_id }}/firewall/ipset/ipfilter-net0"
              - --output-format
              - json
          register: r15_live_ipfilter
          changed_when: false

        - name: Assert each firewall option matches the declared policy
          ansible.builtin.assert:
            that:
              - (r15_option_check.0.stdout | from_json)[r15_option_check.1.key] | default('unset') | string == r15_option_check.1.value | string
            fail_msg: >-
              Drift on {{ r15_option_check.0.r15_guest.key }}: option {{ r15_option_check.1.key }}
              should be {{ r15_option_check.1.value }}
            quiet: true
          loop: "{{ r15_live_options.results | product(runner_class_firewall_options | dict2items) | list }}"
          loop_control:
            loop_var: r15_option_check
            label: "{{ r15_option_check.0.r15_guest.key }} {{ r15_option_check.1.key }}"

        - name: Assert each guest holds exactly the enabled group rule and the enabled control rule
          ansible.builtin.assert:
            that:
              - (r15_rule_check.stdout | from_json) | length == 2
              - (r15_rule_check.stdout | from_json) | map(attribute='enable') | map('string') | list == ['1', '1']
              - >-
                (r15_rule_check.stdout | from_json) | selectattr('type', 'eq', 'group')
                | selectattr('action', 'eq', runner_class_security_group) | list | length == 1
              - >-
                (r15_rule_check.stdout | from_json) | selectattr('type', 'eq', 'in') | selectattr('action', 'eq', 'ACCEPT')
                | selectattr('proto', 'eq', 'tcp') | selectattr('dport', 'eq', r15_control_port | string)
                | selectattr('source', 'eq', guest_network.gateway) | list | length == 1
            fail_msg: "Drift on {{ r15_rule_check.r15_guest.key }}: not exactly the enabled group rule plus the enabled control rule from the gateway"
            quiet: true
          loop: "{{ r15_live_rules.results }}"
          loop_control:
            loop_var: r15_rule_check
            label: "{{ r15_rule_check.r15_guest.key }}"

        - name: Assert each guest has one NIC on the guest vnet with the firewall flag, and starts on boot
          ansible.builtin.assert:
            that:
              - (r15_config_check.stdout | from_json).onboot | default(0) | int == 1
              - (r15_config_check.stdout | from_json).keys() | select('match', '^net[0-9]+$') | list == ['net0']
              - (r15_config_check.stdout | from_json).net0 is search('(^|,)firewall=' ~ runner_class_nic_firewall ~ '(,|$)')
              - (r15_config_check.stdout | from_json).net0 is search('(^|,)bridge=' ~ guest_network.vnet ~ '(,|$)')
            fail_msg: "Drift on {{ r15_config_check.r15_guest.key }}: onboot, the NIC set, the NIC firewall flag or the bridge differs"
            quiet: true
          loop: "{{ r15_live_config.results }}"
          loop_control:
            loop_var: r15_config_check
            label: "{{ r15_config_check.r15_guest.key }}"

        - name: Assert the VM source filter holds only its own address
          ansible.builtin.assert:
            that:
              - (r15_live_ipfilter.stdout | from_json) | map(attribute='cidr') | map('regex_replace', '/32$', '') | list == [r15_guests.vm.address]
            fail_msg: "Drift on the VM: ipfilter-net0 does not hold exactly {{ r15_guests.vm.address }}"
            quiet: true
      rescue:
        - name: Stop any probe guest that is already running without the declared policy
          ansible.builtin.command:
            argv:
              - "{{ 'pct' if r15_status_item.r15_guest.value.kind == 'lxc' else 'qm' }}"
              - stop
              - "{{ r15_status_item.r15_guest.value.vm_id }}"
          loop: "{{ r15_status.results }}"
          loop_control:
            loop_var: r15_status_item
            label: "{{ r15_status_item.r15_guest.key }}"
          when: (r15_status_item.stdout | from_json).status == 'running'
          changed_when: true
          failed_when: false

        - name: Refuse to start the guests
          ansible.builtin.fail:
            msg: A probe guest differs from the declared policy; no guest was started and any running one was stopped

    - name: Start every stopped probe guest
      ansible.builtin.command:
        argv:
          - "{{ 'pct' if r15_status_item.r15_guest.value.kind == 'lxc' else 'qm' }}"
          - start
          - "{{ r15_status_item.r15_guest.value.vm_id }}"
      loop: "{{ r15_status.results }}"
      loop_control:
        loop_var: r15_status_item
        label: "{{ r15_status_item.r15_guest.key }}"
      when: (r15_status_item.stdout | from_json).status == 'stopped'
      changed_when: true

    - name: Read the public key to install in the container
      ansible.builtin.command:
        argv: [cat, "{{ r15_control_key }}.pub"]
      register: r15_lxc_public_key
      changed_when: false

    - name: Open the control channel in each container clone through pct exec
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ r15_guest.value.vm_id }}"
          - --
          - sh
          - -c
          - >-
            install -d -m 0700 /root/.ssh && echo "$1" > /root/.ssh/authorized_keys
            && chmod 0600 /root/.ssh/authorized_keys && ssh-keygen -A && systemctl enable --now ssh.service
          - r15-channel
          - "{{ r15_lxc_public_key.stdout }}"
      loop: "{{ r15_guests | dict2items | selectattr('value.kind', 'eq', 'lxc') | list }}"
      loop_control:
        loop_var: r15_guest
        label: "{{ r15_guest.key }}"
      changed_when: true

    - name: Wait until each guest accepts the control channel
      ansible.builtin.wait_for:
        host: "{{ r15_guest.value.address }}"
        port: "{{ r15_control_port }}"
        delay: 2
        timeout: 240
      loop: "{{ r15_guests | dict2items }}"
      loop_control:
        loop_var: r15_guest
        label: "{{ r15_guest.key }}"

    - name: Check which probe tools each guest has
      ansible.builtin.command:
        argv: "{{ r15_ssh_base + [r15_guest.value.login_user ~ '@' ~ r15_guest.value.address, 'command -v curl && command -v timeout'] }}"
      loop: "{{ r15_guests | dict2items }}"
      loop_control:
        loop_var: r15_guest
        label: "{{ r15_guest.key }}"
      register: r15_tools
      until: r15_tools.rc != 255
      retries: 12
      delay: 5
      failed_when: r15_tools.rc == 255
      changed_when: false

    - name: Install the probe tools where missing
      ansible.builtin.command:
        argv: >-
          {{ r15_ssh_base + [r15_tool_check.r15_guest.value.login_user ~ '@' ~ r15_tool_check.r15_guest.value.address,
          ('' if r15_tool_check.r15_guest.value.login_user == 'root' else 'sudo -n ')
          ~ 'sh -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl coreutils ca-certificates"'] }}
      loop: "{{ r15_tools.results }}"
      loop_control:
        loop_var: r15_tool_check
        label: "{{ r15_tool_check.r15_guest.key }}"
      when: r15_tool_check.rc != 0
      changed_when: true

    - name: Resolve the channel controls from this run's connection to each guest
      ansible.builtin.set_fact:
        r15_targets_text: >-
          {{ r15_targets_text | default(lookup('ansible.builtin.file', r15_targets_file))
          | regex_replace(' channel:' ~ r15_tool_check.r15_guest.key ~ '(?=[ \t\r]*$)',
          ' ' ~ ('True' if r15_tool_check.rc != 255 else 'False'), multiline=True) }}
      loop: "{{ r15_tools.results }}"
      loop_control:
        loop_var: r15_tool_check
        label: "{{ r15_tool_check.r15_guest.key }}"

    - name: Copy the probe into each guest
      ansible.builtin.command:
        argv: >-
          {{ r15_ssh_base + [r15_guest.value.login_user ~ '@' ~ r15_guest.value.address,
          'mkdir -p ' ~ r15_guest_dir ~ ' && cat > ' ~ r15_guest_dir ~ '/r15-probe.sh && chmod 0755 ' ~ r15_guest_dir ~ '/r15-probe.sh'] }}
        stdin: "{{ lookup('ansible.builtin.file', r15_probe_script) }}"
      loop: "{{ r15_guests | dict2items }}"
      loop_control:
        loop_var: r15_guest
        label: "{{ r15_guest.key }}"
      changed_when: false

    - name: Copy the targets into each guest
      ansible.builtin.command:
        argv: "{{ r15_ssh_base + [r15_guest.value.login_user ~ '@' ~ r15_guest.value.address, 'cat > ' ~ r15_guest_dir ~ '/targets.env'] }}"
        stdin: "{{ r15_targets_text }}"
      loop: "{{ r15_guests | dict2items }}"
      loop_control:
        loop_var: r15_guest
        label: "{{ r15_guest.key }}"
      changed_when: false

    - name: Read the running guests on the node before the red-first run
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      register: r15_resources
      when: r15_phase == 'red-first'
      changed_when: false

    - name: Refuse the red-first run while any other guest is running
      ansible.builtin.assert:
        that:
          - >-
            (r15_resources.stdout | from_json) | selectattr('status', 'eq', 'running') | map(attribute='vmid') | map('int')
            | difference(r15_guests.values() | map(attribute='vm_id') | map('int') | list) | list | length == 0
        fail_msg: Stopping the node firewall would expose a guest that is not a probe; stop it first
      when: r15_phase == 'red-first'

    - name: Clear a failed guard unit from an earlier red-first run
      ansible.builtin.command:
        argv: [systemctl, reset-failed, "{{ r15_guard_unit }}.service"]
      when: r15_phase == 'red-first'
      changed_when: false
      failed_when: false

    - name: Arm the guard that restarts the firewall even if this play dies
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--on-active={{ r15_guard_minutes }}min"
          - "--unit={{ r15_guard_unit }}"
          - /usr/bin/systemctl
          - start
          - pve-firewall.service
      when: r15_phase == 'red-first'
      changed_when: true

    - name: Run the probe, with the host firewall stopped for the red-first phase only
      block:
        - name: Stop the host firewall
          ansible.builtin.command:
            argv: [pve-firewall, stop]
          when: r15_phase == 'red-first'
          changed_when: true

        - name: Run the probe in each guest
          ansible.builtin.command:
            argv: >-
              {{ r15_ssh_base + [r15_guest.value.login_user ~ '@' ~ r15_guest.value.address,
              ('' if r15_guest.value.login_user == 'root' else 'sudo -n ') ~ 'bash ' ~ r15_guest_dir ~ '/r15-probe.sh --guest '
              ~ r15_guest.key ~ ' --phase ' ~ r15_phase ~ ' --targets ' ~ r15_guest_dir ~ '/targets.env'] }}
          loop: "{{ r15_guests | dict2items }}"
          loop_control:
            loop_var: r15_guest
            label: "{{ r15_guest.key }}"
          register: r15_runs
          failed_when: false
          changed_when: false
          timeout: "{{ r15_probe_timeout }}"

        - name: Keep each probe output on the host
          ansible.builtin.copy:
            content: "{{ r15_run.stdout }}\n{{ r15_run.stderr }}\nEXIT {{ r15_run.rc }}\n"
            dest: "{{ r15_work_dir }}/r15-{{ r15_phase }}-{{ r15_run.r15_guest.key }}.txt"
            mode: "0600"
            owner: root
            group: root
          loop: "{{ r15_runs.results }}"
          loop_control:
            loop_var: r15_run
            label: "{{ r15_run.r15_guest.key }}"
      always:
        - name: Start the host firewall again
          ansible.builtin.command:
            argv: [pve-firewall, start]
          when: r15_phase == 'red-first'
          changed_when: true

        - name: Wait until the firewall reports enabled and running
          ansible.builtin.command:
            argv: [pve-firewall, status]
          register: r15_firewall_status
          until: "r15_firewall_status.stdout == 'Status: enabled/running'"
          retries: 12
          delay: 5
          when: r15_phase == 'red-first'
          changed_when: false

        - name: Drop the connections the guests opened while the firewall was down
          ansible.builtin.command:
            argv: [conntrack, -D, -s, "{{ guest_network.cidr }}"]
          when: r15_phase == 'red-first'
          changed_when: false
          failed_when: false

        - name: Cancel the guard now that the firewall runs again
          ansible.builtin.command:
            argv: [systemctl, stop, "{{ r15_guard_unit }}.timer"]
          when: "r15_phase == 'red-first' and r15_firewall_status.stdout | default('') == 'Status: enabled/running'"
          changed_when: true
          failed_when: false

    - name: Record the control channel measured in this run
      ansible.builtin.copy:
        content: |
          {% for tool in r15_tools.results %}
          CONTROL control_channel_{{ tool.r15_guest.key }} {{ tool.r15_guest.value.address }}:{{ r15_control_port }} {{ 'True' if tool.rc != 255 else 'False' }}
          {% endfor %}
        dest: "{{ r15_work_dir }}/r15-{{ r15_phase }}-control.txt"
        mode: "0600"
        owner: root
        group: root

    - name: Fetch every output to this machine
      ansible.builtin.fetch:
        src: "{{ r15_work_dir }}/r15-{{ r15_phase }}-{{ r15_name }}.txt"
        dest: "{{ r15_output_dir }}/"
        flat: true
      loop: "{{ (r15_guests.keys() | list) + ['control'] }}"
      loop_control:
        loop_var: r15_name

    - name: Show each summary line
      ansible.builtin.debug:
        msg: "{{ r15_summary.r15_guest.key }}: {{ r15_summary.stdout_lines | select('match', '^SUMMARY') | list }}"
      loop: "{{ r15_runs.results }}"
      loop_control:
        loop_var: r15_summary
        label: "{{ r15_summary.r15_guest.key }}"

    - name: Fail unless every probe exited 0
      ansible.builtin.assert:
        that: r15_run_check.rc == 0
        fail_msg: >-
          The {{ r15_run_check.r15_guest.key }} probe exited {{ r15_run_check.rc }};
          read {{ r15_output_dir }}/r15-{{ r15_phase }}-{{ r15_run_check.r15_guest.key }}.txt
        quiet: true
      loop: "{{ r15_runs.results }}"
      loop_control:
        loop_var: r15_run_check
        label: "{{ r15_run_check.r15_guest.key }}"
