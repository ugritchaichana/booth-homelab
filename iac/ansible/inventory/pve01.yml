---
# Needs env PVE01_WIN_SSH_KEY: Windows-side private key path used by the ssh.exe proxy hop.
all:
  children:
    pve:
      hosts:
        pve01:
          ansible_host: 10.99.0.2
          ansible_user: root
          pve_win_ssh_key: "{{ lookup('env', 'PVE01_WIN_SSH_KEY', default=undef('set PVE01_WIN_SSH_KEY')) }}"
          ansible_become: false
          ansible_ssh_pipelining: true
          ansible_ssh_private_key_file: ~/.ssh/homelab_pve01_ed25519
          ansible_ssh_common_args: >-
            -o ProxyCommand="/mnt/c/Windows/System32/OpenSSH/ssh.exe -i {{ pve_win_ssh_key }} -W %h:%p root@10.99.0.2"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ansible/pve01_known_hosts
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8
            -o ControlMaster=auto -o ControlPersist=60s
