---
- name: Assert the blocked module list is a list that holds hv_sock
  ansible.builtin.assert:
    that:
      - hyperv_guest_blocked_modules is sequence
      - hyperv_guest_blocked_modules is not string
      - "'hv_sock' in hyperv_guest_blocked_modules"
    fail_msg: hyperv_guest_blocked_modules must be a list that contains hv_sock, otherwise the drop-in blocks nothing

- name: Block the vsock transport from loading
  ansible.builtin.copy:
    dest: "{{ hyperv_guest_modprobe_dropin }}"
    content: "{% for module in hyperv_guest_blocked_modules %}install {{ module }} /bin/false\n{% endfor %}"
    owner: root
    group: root
    mode: "0644"

- name: Unload the blocked modules
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
  loop: "{{ hyperv_guest_blocked_modules }}"

- name: Read installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: Read services
  ansible.builtin.service_facts:

- name: Assert no host-integration daemon is installed or running
  ansible.builtin.assert:
    that:
      - ansible_facts.packages | list | intersect(hyperv_guest_forbidden_packages) | length == 0
      - ansible_facts.services | list | select('match', hyperv_guest_forbidden_service_pattern)
        | map('extract', ansible_facts.services) | selectattr('state', 'equalto', 'running') | list | length == 0
    fail_msg: A Hyper-V KVP, VSS or file-copy daemon is installed or running; remove it, it is a host-to-guest channel

- name: Read the loaded kernel modules
  ansible.builtin.slurp:
    src: /proc/modules
  register: hyperv_guest_loaded_modules

- name: Read what modprobe would do for each blocked module
  ansible.builtin.command: modprobe -n -v {{ item }}
  loop: "{{ hyperv_guest_blocked_modules }}"
  register: hyperv_guest_modprobe_plan
  changed_when: false

- name: Assert the blocked modules are not loaded and cannot load
  ansible.builtin.assert:
    that:
      - (hyperv_guest_loaded_modules.content | b64decode).splitlines() | map('split', ' ') | map('first')
        | intersect(hyperv_guest_blocked_modules) | length == 0
      - hyperv_guest_modprobe_plan.results | map(attribute='stdout') | reject('search', 'install /bin/false') | list | length == 0
    fail_msg: A blocked Hyper-V module is loaded, or modprobe would load it; check the drop-in and reboot
