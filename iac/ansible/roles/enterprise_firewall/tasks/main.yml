---
# ==============================================================================
# Proxmox Zero-Trust Firewall & Isolation Tasks (Idempotent)
# ==============================================================================

- name: Check bridge port isolation state on runner veth interfaces
  ansible.builtin.command: "bridge link show dev {{ item }}"
  loop:
    - veth102i0
    - veth103i0
  register: bridge_links
  failed_when: false
  changed_when: false

- name: Enable bridge port isolation on runner veth interfaces
  ansible.builtin.command: "bridge link set dev {{ item.item }} isolated on"
  loop: "{{ bridge_links.results }}"
  when: item.rc == 0 and 'isolated on' not in item.stdout
  register: iso_res
  changed_when: iso_res.rc == 0

- name: Install egress resolver and ipset packages
  ansible.builtin.apt:
    name:
      - dnsmasq-base
      - ipset
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create egress resolver config directory
  ansible.builtin.file:
    path: /etc/homelab-egress
    state: directory
    mode: "0755"

- name: Deploy egress resolver config generated from egress_allowed_domains
  ansible.builtin.template:
    src: egress-dnsmasq.conf.j2
    dest: /etc/homelab-egress/dnsmasq.conf
    mode: "0644"
    validate: /usr/sbin/dnsmasq --test --conf-file=%s
  notify: Restart Egress DNS

- name: Deploy egress resolver systemd unit
  ansible.builtin.template:
    src: homelab-egress-dns.service.j2
    dest: /etc/systemd/system/homelab-egress-dns.service
    mode: "0644"
  notify: Restart Egress DNS

- name: Enable and start egress resolver before any DNS redirect
  ansible.builtin.systemd:
    name: homelab-egress-dns.service
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy persistent zero-trust firewall script from Jinja2 template
  ansible.builtin.template:
    src: homelab-firewall.j2
    dest: /etc/network/if-up.d/homelab-firewall
    mode: "0755"
  notify: Apply Firewall Rules
