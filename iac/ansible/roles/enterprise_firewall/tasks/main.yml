---
# ==============================================================================
# Proxmox Zero-Trust Firewall & Isolation Tasks
# ==============================================================================

- name: Enable bridge port isolation on runner veth interfaces
  command: "bridge link set dev {{ item }} isolated on"
  loop:
    - veth102i0
    - veth103i0
  register: bridge_iso_result
  failed_when: false
  changed_when: bridge_iso_result.rc == 0

- name: Deploy persistent zero-trust firewall script to /etc/network/if-up.d/homelab-firewall
  copy:
    dest: /etc/network/if-up.d/homelab-firewall
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Auto-generated by Ansible - Zero-Trust Netfilter Rules
      set -euo pipefail

      # Flush / Create HOMELAB-FORWARD chain
      iptables -N HOMELAB-FORWARD 2>/dev/null || iptables -F HOMELAB-FORWARD

      # Ensure hook in FORWARD chain
      if ! iptables -C FORWARD -j HOMELAB-FORWARD 2>/dev/null; then
          iptables -I FORWARD 1 -j HOMELAB-FORWARD
      fi

      # 1. Allow Established and Related Connections
      iptables -A HOMELAB-FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

      # 2. Block East-West Runner-to-Runner Traffic
      iptables -A HOMELAB-FORWARD -s 10.99.20.101 -d 10.99.20.103 -j DROP
      iptables -A HOMELAB-FORWARD -s 10.99.20.103 -d 10.99.20.101 -j DROP

      # 3. Allow Runners to Access MinIO S3 API (:9000)
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -d 10.99.20.20 -p tcp --dport 9000 -j ACCEPT

      # 4. Block Runners from Accessing MinIO Web Console (:9001)
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -d 10.99.20.20 -p tcp --dport 9001 -j DROP

      # 5. Whitelist Internet Egress (DNS 53, HTTP 80, HTTPS 443, NTP 123)
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -p udp --dport 53 -j ACCEPT
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -p tcp --dport 53 -j ACCEPT
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -p tcp --dport 80 -j ACCEPT
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -p tcp --dport 443 -j ACCEPT
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -p udp --dport 123 -j ACCEPT

      # 6. Default Deny Egress
      iptables -A HOMELAB-FORWARD -s 10.99.20.0/24 -j DROP
  notify: Apply Firewall Rules

- name: Apply current firewall rules immediately
  command: /etc/network/if-up.d/homelab-firewall
  changed_when: true
