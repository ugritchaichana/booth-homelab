---
# ==============================================================================
# Proxmox Zero-Trust Firewall & Isolation Tasks
# ==============================================================================

- name: Enable bridge port isolation on runner veth interfaces
  command: "bridge link set dev {{ item }} isolated on"
  loop:
    - veth102i0
    - veth103i0
  register: bridge_iso_result
  failed_when: false
  changed_when: bridge_iso_result.rc == 0

- name: Deploy persistent zero-trust firewall script from Jinja2 template
  template:
    src: homelab-firewall.j2
    dest: /etc/network/if-up.d/homelab-firewall
    mode: "0755"
  notify: Apply Firewall Rules

- name: Apply current firewall rules immediately
  command: /etc/network/if-up.d/homelab-firewall
  changed_when: true
