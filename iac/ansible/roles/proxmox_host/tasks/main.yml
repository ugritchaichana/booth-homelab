---
# ==============================================================================
# Proxmox VE Host Configuration & LXC Appliance Template Management
# ==============================================================================

- name: Update Proxmox VE Appliance Manager (pveam) metadata
  command: pveam update
  changed_when: false

- name: Ensure Debian 12 standard LXC template is cached locally
  command: pveam download local {{ debian_template_filename | default('debian-12-standard_12.7-1_amd64.tar.zst') }}
  register: debian_dl_res
  failed_when: false
  changed_when: "'already exists' not in debian_dl_res.stderr and debian_dl_res.rc == 0"

- name: Ensure Alpine 3.23 default LXC template is cached locally
  command: pveam download local {{ alpine_template_filename | default('alpine-3.23-default_20241201_amd64.tar.xz') }}
  register: alpine_dl_res
  failed_when: false
  changed_when: "'already exists' not in alpine_dl_res.stderr and alpine_dl_res.rc == 0"

# Self-healing: host watchdog

- name: Install runner watchdog script
  copy:
    src: "{{ role_path }}/../../../../scripts/proxmox/watchdog/homelab-runner-watchdog.sh"
    dest: /usr/local/sbin/homelab-runner-watchdog.sh
    mode: "0755"

- name: Install runner watchdog systemd units
  copy:
    src: "{{ role_path }}/../../../../scripts/proxmox/watchdog/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - homelab-runner-watchdog.service
    - homelab-runner-watchdog.timer

- name: Create watchdog config when absent
  copy:
    dest: /etc/default/homelab-runner-watchdog
    content: "WATCHDOG_CTS=\"102 103 104\"\n"
    force: no
    mode: "0644"

- name: Enable and start the runner watchdog timer
  systemd:
    name: homelab-runner-watchdog.timer
    enabled: yes
    state: started
    daemon_reload: yes
