---
- name: Disable the pve-enterprise repository
  ansible.builtin.deb822_repository:
    name: pve-enterprise
    types: deb
    uris: https://enterprise.proxmox.com/debian/pve
    suites: "{{ pve_repos_suite }}"
    components: pve-enterprise
    signed_by: "{{ pve_repos_keyring }}"
    enabled: false

- name: Disable the ceph enterprise repository
  ansible.builtin.deb822_repository:
    name: ceph
    types: deb
    uris: https://enterprise.proxmox.com/debian/ceph-squid
    suites: "{{ pve_repos_suite }}"
    components: enterprise
    signed_by: "{{ pve_repos_keyring }}"
    enabled: false

# Stanza per the Proxmox wiki "Package Repositories", No-Subscription section
- name: Enable the pve-no-subscription repository
  ansible.builtin.deb822_repository:
    name: pve-no-subscription
    types: deb
    uris: http://download.proxmox.com/debian/pve
    suites: "{{ pve_repos_suite }}"
    components: pve-no-subscription
    signed_by: "{{ pve_repos_keyring }}"
    enabled: true

- name: Refresh the apt cache and apply a full upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
  environment:
    DEBIAN_FRONTEND: noninteractive
  # One SSH session held silent through the proxy hop stalled after a 6 min upgrade
  async: 1800
  poll: 15

- name: Check for a pending reboot marker
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: pve_repos_reboot_marker

- name: Find the newest installed kernel image
  ansible.builtin.shell: set -o pipefail; ls /boot/vmlinuz-* | sed 's|/boot/vmlinuz-||' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: pve_repos_newest_kernel
  changed_when: false

- name: Reboot into the newest kernel
  ansible.builtin.reboot:
    reboot_timeout: "{{ pve_repos_reboot_timeout }}"
    test_command: pveversion
  when: pve_repos_reboot_marker.stat.exists or pve_repos_newest_kernel.stdout != ansible_facts.kernel
