---
# ==============================================================================
# Node.js 22 LTS & Angular Jest Headless Runner Configuration (CT 103)
# ==============================================================================

- name: Check whether the NodeSource apt list exists
  stat:
    path: /etc/apt/sources.list.d/nodesource.list
  register: nodesource_apt_list

- name: Install the NodeSource Node.js 22.x repository
  when: not nodesource_apt_list.stat.exists
  block:
    - name: Create a private temp file for the NodeSource setup script
      ansible.builtin.tempfile:
        state: file
        suffix: nodesource
      register: nodesource_setup_script

    - name: Download NodeSource Node.js 22.x setup script
      get_url:
        url: "https://deb.nodesource.com/setup_22.x"
        dest: "{{ nodesource_setup_script.path }}"
        force: true
        mode: "0700"

    - name: Execute NodeSource repository setup
      command: "{{ nodesource_setup_script.path }}"
  always:
    - name: Remove the NodeSource setup script
      file:
        path: "{{ nodesource_setup_script.path }}"
        state: absent
      when: nodesource_setup_script.path is defined

- name: Install nodejs
  apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Install MinIO Client (mc)
  get_url:
    url: "{{ mc_binary_url }}"
    dest: /usr/local/bin/mc
    mode: "0755"

- name: Require MinIO reader credentials from the environment
  assert:
    that:
      - lookup('env', 'SDET_PR_READER_USER') | length > 0
      - lookup('env', 'SDET_PR_READER_PASS') | length > 0
    fail_msg: "SDET_PR_READER_USER and SDET_PR_READER_PASS must be set in the environment"

- name: Ensure MinIO reader alias exists on runner
  become_user: "{{ runner_user }}"
  command: >
    /usr/local/bin/mc alias set minio {{ minio_s3_endpoint }}
    {{ lookup('env', 'SDET_PR_READER_USER') | quote }} {{ lookup('env', 'SDET_PR_READER_PASS') | quote }}
  changed_when: false
  no_log: true

- name: Remove any writer alias from runner
  become_user: "{{ runner_user }}"
  command: /usr/local/bin/mc alias remove minio-writer
  changed_when: false
  failed_when: false
