---
# ==============================================================================
# MinIO S3 Remote Cache Configuration (Alpine Linux)
# ==============================================================================

- name: Require MinIO root credentials from the environment
  assert:
    that:
      - minio_root_user | length > 0
      - minio_root_password | length > 0
    fail_msg: "MINIO_ROOT_USER and MINIO_ROOT_PASSWORD must be set in the environment"

- name: Create MinIO data directory
  file:
    path: "{{ minio_data_dir }}"
    state: directory
    mode: "0755"

- name: Deploy MinIO environment configuration from Jinja2 template
  template:
    src: minio.env.j2
    dest: /etc/minio.env
    mode: "0600"
  no_log: true

- name: Deploy OpenRC service for MinIO on Alpine from Jinja2 template
  template:
    src: minio.initd.j2
    dest: /etc/init.d/minio
    mode: "0755"

- name: Ensure MinIO service is enabled and started
  service:
    name: minio
    state: started
    enabled: yes

- name: Configure MinIO Client (mc) local alias
  command: >
    /usr/local/bin/mc alias set local http://127.0.0.1:{{ minio_api_port }}
    {{ minio_root_user }} {{ minio_root_password }}
  register: mc_alias_res
  changed_when: false
  no_log: true

- name: Create required S3 buckets
  command: "/usr/local/bin/mc mb --ignore-existing local/{{ item.name }}"
  loop: "{{ minio_buckets }}"
  changed_when: false

- name: Keep buckets private (no anonymous access)
  command: "/usr/local/bin/mc anonymous set none local/{{ item.name }}"
  loop: "{{ minio_buckets }}"
  changed_when: false
