---
- name: Assert the identity cannot manage identities or the host
  ansible.builtin.assert:
    that:
      - pve_api_identity_privileges | intersect(pve_api_identity_forbidden_privileges) | length == 0
      - pve_api_identity_rotate | string | lower in ['true', 'false', 'yes', 'no']
    fail_msg: The provisioner role may not hold Permissions.Modify, User.Modify or Sys.Modify, and pve_api_identity_rotate must be true or false

- name: Read the Proxmox users
  ansible.builtin.command: pveum user list --output-format json
  register: pve_api_identity_users
  changed_when: false

- name: Create the provisioning user without a password
  ansible.builtin.command:
    argv:
      - pveum
      - user
      - add
      - "{{ pve_api_identity_user }}"
      - --comment
      - "{{ pve_api_identity_comment }}"
  when: pve_api_identity_user not in (pve_api_identity_users.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

- name: Read the Proxmox roles
  ansible.builtin.command: pveum role list --output-format json
  register: pve_api_identity_roles
  changed_when: false

- name: Find the current provisioner role
  ansible.builtin.set_fact:
    pve_api_identity_role_current: >-
      {{ pve_api_identity_roles.stdout | from_json
      | selectattr('roleid', 'equalto', pve_api_identity_role) | list }}

- name: Create the provisioner role
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - add
      - "{{ pve_api_identity_role }}"
      - --privs
      - "{{ pve_api_identity_privileges | sort | join(' ') }}"
  when: pve_api_identity_role_current | length == 0
  changed_when: true

- name: Replace the provisioner role privileges when they differ
  ansible.builtin.command:
    argv:
      - pveum
      - role
      - modify
      - "{{ pve_api_identity_role }}"
      - --privs
      - "{{ pve_api_identity_privileges | sort | join(' ') }}"
  when:
    - pve_api_identity_role_current | length > 0
    - (pve_api_identity_role_current | first).privs.split(',') | sort != pve_api_identity_privileges | sort
  changed_when: true

- name: Read the resource pools
  ansible.builtin.command: pveum pool list --output-format json
  register: pve_api_identity_pools
  changed_when: false

- name: Create the resource pool
  ansible.builtin.command:
    argv:
      - pveum
      - pool
      - add
      - "{{ pve_api_identity_pool }}"
  when: pve_api_identity_pool not in (pve_api_identity_pools.stdout | from_json | map(attribute='poolid') | list)
  changed_when: true

- name: Manage the API token and its secret
  ansible.builtin.import_tasks: token.yml

- name: Read the ACL entries
  ansible.builtin.command: pveum acl list --output-format json
  register: pve_api_identity_acl_raw
  changed_when: false

- name: Compute the grants already in place
  ansible.builtin.set_fact:
    pve_api_identity_user_granted: >-
      {{ pve_api_identity_acl_raw.stdout | from_json
      | selectattr('ugid', 'equalto', pve_api_identity_user)
      | selectattr('roleid', 'equalto', pve_api_identity_role)
      | map(attribute='path') | list }}
    pve_api_identity_token_granted: >-
      {{ pve_api_identity_acl_raw.stdout | from_json
      | selectattr('ugid', 'equalto', pve_api_identity_token_id)
      | selectattr('roleid', 'equalto', pve_api_identity_role)
      | map(attribute='path') | list }}

- name: Grant the role to the user and the privilege-separated token
  ansible.builtin.command:
    argv:
      - pveum
      - acl
      - modify
      - "{{ item }}"
      - --roles
      - "{{ pve_api_identity_role }}"
      - --users
      - "{{ pve_api_identity_user }}"
      - --tokens
      - "{{ pve_api_identity_token_id }}"
      - --propagate
      - "1"
  loop: "{{ pve_api_identity_acl_paths | reject('in', pve_api_identity_user_granted | intersect(pve_api_identity_token_granted)) | list }}"
  changed_when: true

- name: Read the ACL entries again
  ansible.builtin.command: pveum acl list --output-format json
  register: pve_api_identity_acl_after
  changed_when: false

- name: Assert the identity holds exactly the declared grants
  ansible.builtin.assert:
    that:
      - pve_api_identity_unexpected | length == 0
      - pve_api_identity_user_after | difference(pve_api_identity_acl_paths) | length == 0
      - pve_api_identity_acl_paths | difference(pve_api_identity_user_after) | length == 0
      - pve_api_identity_acl_paths | difference(pve_api_identity_token_after) | length == 0
    fail_msg: The identity holds a grant outside the declared paths and role, or lacks one; remove it with pveum acl delete
  vars:
    pve_api_identity_identity_entries: >-
      {{ pve_api_identity_acl_after.stdout | from_json
      | selectattr('ugid', 'in', [pve_api_identity_user, pve_api_identity_token_id]) | list }}
    pve_api_identity_unexpected: >-
      {{ pve_api_identity_identity_entries | rejectattr('roleid', 'equalto', pve_api_identity_role) | list
      + (pve_api_identity_identity_entries | selectattr('roleid', 'equalto', pve_api_identity_role)
      | rejectattr('path', 'in', pve_api_identity_acl_paths) | list) }}
    pve_api_identity_user_after: >-
      {{ pve_api_identity_identity_entries
      | selectattr('ugid', 'equalto', pve_api_identity_user)
      | selectattr('roleid', 'equalto', pve_api_identity_role)
      | map(attribute='path') | list }}
    pve_api_identity_token_after: >-
      {{ pve_api_identity_identity_entries
      | selectattr('ugid', 'equalto', pve_api_identity_token_id)
      | selectattr('roleid', 'equalto', pve_api_identity_role)
      | map(attribute='path') | list }}
