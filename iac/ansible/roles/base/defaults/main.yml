---
base_container_test_mode: false

base_automation_user: "{{ automation_user | default('automation') }}"
base_automation_shell: /bin/bash
base_automation_authorized_keys: []

base_root_authorized_keys: []
base_root_authorized_keys_revoked: []
base_root_key_from: "{{ management_source | default('') }}"
base_root_authorized_keys_path: /root/.ssh/authorized_keys

base_sshd_dropin_path: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
base_sshd_service: ssh

base_deadman_minutes: "{{ deadman_minutes | default(10) }}"
base_deadman_unit: homelab-deadman-ssh
base_deadman_dir: /var/lib/homelab/deadman-ssh

base_fresh_session_ssh_args: -o ControlMaster=no -o ControlPath=none

base_time_servers: "{{ time_servers | default(['0.debian.pool.ntp.org', '1.debian.pool.ntp.org']) }}"
base_journald_system_max_use: "{{ journald_system_max_use | default('200M') }}"
