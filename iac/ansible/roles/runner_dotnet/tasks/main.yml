---
# ==============================================================================
# .NET SDK & Docker-in-LXC Runner Configuration (CT 102)
# ==============================================================================

- name: Probe for the Microsoft package repository package
  command: dpkg-query -W -f='${Status}' packages-microsoft-prod
  register: msft_repo_probe
  changed_when: false
  failed_when: false

- name: Add the Microsoft package repository
  when: "'install ok installed' not in (msft_repo_probe.stdout | default(''))"
  block:
    - name: Create a private temporary directory for the Microsoft repository deb
      ansible.builtin.tempfile:
        state: directory
        prefix: msft-repo.
      register: msft_repo_tmp

    - name: Download and install the Microsoft repository deb
      block:
        - name: Download Microsoft package repository deb
          get_url:
            url: "https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb"
            dest: "{{ msft_repo_tmp.path }}/packages-microsoft-prod.deb"
            mode: "0644"

        - name: Install Microsoft repository
          apt:
            deb: "{{ msft_repo_tmp.path }}/packages-microsoft-prod.deb"
            state: present
      always:
        - name: Remove the temporary directory
          file:
            path: "{{ msft_repo_tmp.path }}"
            state: absent

- name: Install dotnet-sdk-10.0 next to dotnet-sdk-8.0
  apt:
    name:
      - dotnet-sdk-8.0
      - dotnet-sdk-10.0
    state: present
    update_cache: yes

- name: Install Docker CE prerequisites
  apt:
    name:
      - docker.io
      - containerd
    state: present

- name: Read members of the docker group
  command: getent group docker
  register: docker_group
  changed_when: false
  failed_when: false

- name: Remove runner user from docker group
  command: "gpasswd -d {{ runner_user }} docker"
  when: runner_user in (docker_group.stdout.split(':')[-1].split(',') if docker_group.rc == 0 else [])

- name: Install MinIO Client (mc)
  get_url:
    url: "{{ mc_binary_url }}"
    dest: /usr/local/bin/mc
    mode: "0755"

- name: Require MinIO reader credentials from the environment
  assert:
    that:
      - lookup('env', 'SDET_PR_READER_USER') | length > 0
      - lookup('env', 'SDET_PR_READER_PASS') | length > 0
    fail_msg: "SDET_PR_READER_USER and SDET_PR_READER_PASS must be set in the environment"

- name: Ensure MinIO reader alias exists on runner
  become_user: "{{ runner_user }}"
  command: >
    /usr/local/bin/mc alias set minio {{ minio_s3_endpoint }}
    {{ lookup('env', 'SDET_PR_READER_USER') | quote }} {{ lookup('env', 'SDET_PR_READER_PASS') | quote }}
  changed_when: false
  no_log: true

- name: Remove any writer alias from runner
  become_user: "{{ runner_user }}"
  command: /usr/local/bin/mc alias remove minio-writer
  changed_when: false
  failed_when: false
