---
- name: Configure the package repositories
  ansible.builtin.import_tasks: repos.yml

- name: Refresh the apt cache and apply a full upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
  environment:
    DEBIAN_FRONTEND: noninteractive
  async: "{{ pve_host_upgrade_timeout }}"
  poll: 15

- name: Check for a pending reboot marker
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: pve_host_reboot_marker

- name: Read the running kernel
  ansible.builtin.command: uname -r
  register: pve_host_running_kernel
  changed_when: false

- name: Find the kernel that boots by default
  ansible.builtin.shell: |
    set -eu
    set -o pipefail
    list=$(proxmox-boot-tool kernel list)
    pin=$(printf '%s\n' "$list" | awk '/^Pinned kernel:/{f=1;next} NF==0{f=0} f{print $1; exit}')
    top=$(printf '%s\n' "$list" | awk '/selected kernels:/{f=1;next} NF==0{f=0} f && $1!="None."{print $1}' | sort -V | tail -1)
    printf '%s\n' "${pin:-$top}"
  args:
    executable: /bin/bash
  register: pve_host_boot_kernel
  changed_when: false

- name: Assert a boot default kernel was found
  ansible.builtin.assert:
    that:
      - pve_host_boot_kernel.stdout | length > 0
    fail_msg: proxmox-boot-tool lists no kernel to boot

- name: Reboot when the running kernel is not the boot default
  ansible.builtin.reboot:
    reboot_timeout: "{{ pve_host_reboot_timeout }}"
    test_command: pveversion
  when: pve_host_reboot_marker.stat.exists or pve_host_boot_kernel.stdout != pve_host_running_kernel.stdout

- name: Read the kernel the host runs after any reboot
  ansible.builtin.command: uname -r
  register: pve_host_booted_kernel
  changed_when: false

- name: Assert the host runs its boot default kernel
  ansible.builtin.assert:
    that:
      - pve_host_booted_kernel.stdout == pve_host_boot_kernel.stdout
    fail_msg: The boot default differs from the running kernel after the reboot step

- name: Read the nested virtualisation parameter
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ pve_host_kvm_parameter_paths }}"
  register: pve_host_nested_parameters
  failed_when: false

- name: Count the CPU virtualisation flags
  ansible.builtin.command: grep -c -E '^flags.*\b(vmx|svm)\b' /proc/cpuinfo
  register: pve_host_virt_flags
  changed_when: false
  failed_when: pve_host_virt_flags.rc > 1

- name: Assert nested KVM is available
  ansible.builtin.assert:
    that:
      - pve_host_virt_flags.stdout | int > 0
      - pve_host_nested_parameters.results
        | selectattr('content', 'defined') | map(attribute='content') | map('b64decode') | map('trim')
        | select('in', ['1', 'Y']) | list | length > 0
    fail_msg: Nested KVM is off; expose virtualisation extensions to the VM and check the kvm module parameter
