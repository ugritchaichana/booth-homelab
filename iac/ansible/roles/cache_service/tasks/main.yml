---
- name: Assert the inputs before changing anything
  ansible.builtin.assert:
    that:
      - cache_service_sha256 | length == 64
      - cache_service_listen_address is regex('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - cache_service_max_size_gib | int > 0
      - cache_service_max_blob_size_bytes | int > 0
    fail_msg: The cache_service inputs are incomplete or malformed

- name: Assert the writer password reached the role
  ansible.builtin.assert:
    that:
      - cache_writer_password | string | length >= cache_service_writer_password_min_length
    fail_msg: cache_writer_password is missing or shorter than the minimum; run scripts/iac/cache-writer-secret.sh
  no_log: true

- name: Install the packages the role needs
  ansible.builtin.apt:
    name:
      - apache2-utils
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the service group
  ansible.builtin.group:
    name: "{{ cache_service_group }}"
    system: true
    state: present

- name: Create the service user without a shell or a home
  ansible.builtin.user:
    name: "{{ cache_service_user }}"
    group: "{{ cache_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    password_lock: true
    state: present

- name: Require the data directory to be the mount point
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ cache_service_data_mount }}"]
  register: cache_service_mount
  changed_when: false
  failed_when: cache_service_mount.rc != 0

- name: Create the data directory on the mount point
  ansible.builtin.file:
    path: "{{ cache_service_data_dir }}"
    state: directory
    owner: "{{ cache_service_user }}"
    group: "{{ cache_service_group }}"
    mode: "0750"

- name: Create the binary directory for the version
  ansible.builtin.file:
    path: "{{ cache_service_install_dir }}/{{ cache_service_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the quarantine directory outside the cache directory
  ansible.builtin.file:
    path: "{{ cache_service_quarantine_dir }}"
    state: directory
    owner: "{{ cache_service_user }}"
    group: "{{ cache_service_group }}"
    mode: "0700"

- name: Install the sweep that quarantines blobs whose content does not match their name
  ansible.builtin.copy:
    src: verify-cas
    dest: "{{ cache_service_install_dir }}/verify-cas"
    owner: root
    group: root
    mode: "0755"
  notify: Restart bazel-remote

- name: Download the pinned bazel-remote binary and verify its digest
  ansible.builtin.get_url:
    url: "{{ cache_service_url }}"
    dest: "{{ cache_service_install_dir }}/{{ cache_service_version }}/bazel-remote"
    checksum: "sha256:{{ cache_service_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart bazel-remote

- name: Point the stable path at the pinned version
  ansible.builtin.file:
    src: "{{ cache_service_install_dir }}/{{ cache_service_version }}/bazel-remote"
    dest: "{{ cache_service_binary_link }}"
    state: link
  notify: Restart bazel-remote

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ cache_service_config_dir }}"
    state: directory
    owner: root
    group: "{{ cache_service_group }}"
    mode: "0750"

- name: Create the htpasswd file with its final owner and mode
  ansible.builtin.copy:
    content: ""
    dest: "{{ cache_service_htpasswd_file }}"
    force: false
    owner: root
    group: "{{ cache_service_group }}"
    mode: "0640"

- name: Check the stored writer hash against the password
  ansible.builtin.command:
    argv: [htpasswd, -vi, "{{ cache_service_htpasswd_file }}", "{{ cache_service_writer_user }}"]
    stdin: "{{ cache_writer_password }}"
  register: cache_service_writer_check
  changed_when: false
  failed_when: cache_service_writer_check.rc not in [0, 3, 6]
  no_log: true

- name: Write the bcrypt hash of the writer password, reading it from stdin
  ansible.builtin.command:
    argv: [htpasswd, -iB, -C, "{{ cache_service_bcrypt_cost }}", "{{ cache_service_htpasswd_file }}", "{{ cache_service_writer_user }}"]
    stdin: "{{ cache_writer_password }}"
  when: cache_service_writer_check.rc != 0
  changed_when: true
  no_log: true
  notify: Restart bazel-remote

- name: Install the systemd unit
  ansible.builtin.template:
    src: bazel-remote.service.j2
    dest: /etc/systemd/system/bazel-remote.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart bazel-remote

- name: Apply pending restarts before the readiness check
  ansible.builtin.meta: flush_handlers

- name: Enable and start the service
  ansible.builtin.systemd_service:
    name: bazel-remote
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the HTTP listener
  ansible.builtin.wait_for:
    host: "{{ cache_service_listen_address }}"
    port: "{{ cache_service_listen_port | int }}"
    timeout: 30
