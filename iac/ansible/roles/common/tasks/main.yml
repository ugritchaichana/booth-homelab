---
# ==============================================================================
# Common Base OS Configuration & Utilities
# ==============================================================================

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install essential baseline utilities
  apt:
    name:
      - curl
      - git
      - zstd
      - tar
      - jq
      - ca-certificates
      - procps
    state: present

- name: Create CI runner user
  user:
    name: "{{ runner_user }}"
    shell: /bin/bash
    home: "/home/{{ runner_user }}"
    create_home: yes

- name: Ensure runner user has no sudoers drop-in
  file:
    path: /etc/sudoers.d/99-runner
    state: absent
