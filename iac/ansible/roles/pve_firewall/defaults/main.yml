---
pve_firewall_node_name: "{{ pve_node_name | default(inventory_hostname) }}"
pve_firewall_cluster_file: /etc/pve/firewall/cluster.fw
pve_firewall_host_file: "/etc/pve/nodes/{{ pve_firewall_node_name }}/host.fw"

pve_firewall_management_sources:
  - "{{ management_source | default('') }}"
pve_firewall_host_options:
  enable: 1
  nftables: 0
  log_level_in: info
pve_firewall_management_ports:
  - 22
  - 8006

pve_firewall_group: guest-egress
pve_firewall_ipset_public: public-v4
pve_firewall_ipset_host_routed: host-routed
pve_firewall_public_halves:
  - 0.0.0.0/1
  - 128.0.0.0/1
pve_firewall_non_public_v4:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 240.0.0.0/4
pve_firewall_host_routed_prefixes: []

pve_firewall_probe_matched:
  - 1.1.1.1
  - 8.8.8.8
  - 172.15.255.255
  - 172.32.0.1
  - 100.63.255.255
  - 100.128.0.1
  - 192.0.1.1
  - 198.20.0.1
  - 203.0.114.1
pve_firewall_probe_not_matched:
  - 0.1.2.3
  - 10.1.2.3
  - 100.64.0.1
  - 127.0.0.1
  - 169.254.1.1
  - 172.16.5.5
  - 192.0.0.1
  - 192.0.2.1
  - 192.168.1.1
  - 198.18.0.1
  - 198.51.100.1
  - 203.0.113.1
  - 224.0.0.1
  - 240.0.0.1

pve_firewall_address_pattern: '^[0-9]{1,3}([.][0-9]{1,3}){3}(/[0-9]{1,2})?$'
pve_firewall_status_retries: 12
pve_firewall_status_delay: 5
pve_firewall_compile_error_patterns:
  - '[(]line [0-9]+[)]'
  - 'errors in '
  - 'skip line'
  - "can't parse"
  - 'unable to parse'
  - 'a zero prefix'
  - 'valid IP address or CIDR'
  - 'no such (security group|alias|ipset|chain)'
  - 'unknown (rule type|log level|macro)'
  - 'invalid interface name'
  - '^ignore !'
  - 'ignoring duplicate'
  - 'unable to (update chain|apply firewall changes)'

pve_firewall_automation_user: "{{ automation_user | default('automation') }}"
pve_firewall_fresh_session_ssh_extra_args: -o ControlPath=none
pve_firewall_deadman_minutes: "{{ deadman_minutes | default(10) }}"
pve_firewall_deadman_unit: homelab-deadman-firewall
pve_firewall_deadman_boot_unit: homelab-deadman-firewall-boot
pve_firewall_deadman_dir: /var/lib/homelab/deadman-firewall

pve_firewall_guest_vnet: "{{ (guest_network | default({})).vnet | default('guests') }}"
pve_firewall_guest_gateway: "{{ (guest_network | default({})).gateway | default('') }}"
pve_firewall_guest_cidr: "{{ (guest_network | default({})).cidr | default('') }}"
pve_firewall_cache_group: cache-ingress
pve_firewall_cache_network: "{{ cache_network | default({}) }}"
pve_firewall_cache_endpoint: "{{ cache_endpoint | default({}) }}"
pve_firewall_guard_policy_file: /etc/homelab/guest-firewall-guard-policy.json
pve_firewall_guard_vnets: >-
  {{ {pve_firewall_guest_vnet: {'groups': [pve_firewall_group], 'allow_gateway_ssh': pve_firewall_guest_gateway}}
  | combine({pve_firewall_cache_network.vnet: {'groups': [pve_firewall_group, pve_firewall_cache_group], 'allow_gateway_ssh': none}}
  if pve_firewall_cache_endpoint.address is defined else {}) }}
pve_firewall_guard_script: /usr/local/sbin/homelab-guest-firewall-guard
pve_firewall_guard_unit: homelab-guest-firewall-guard
pve_firewall_guard_unverified_limit: 3
pve_firewall_guard_args: >-
  --node {{ pve_firewall_node_name }} --policy {{ pve_firewall_guard_policy_file }}
  --unverified-limit {{ pve_firewall_guard_unverified_limit }}
pve_firewall_ipv6_sysctl_file: /etc/sysctl.d/90-homelab-guest-ipv6.conf
pve_firewall_ipv6_sysctls:
  net.ipv6.conf.default.accept_ra: "0"
  net.ipv6.conf.all.accept_ra: "0"
  net.ipv6.conf.default.autoconf: "0"
  net.ipv6.conf.all.autoconf: "0"
  net.ipv6.conf.default.forwarding: "0"
  net.ipv6.conf.all.forwarding: "0"
