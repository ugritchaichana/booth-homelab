services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: sdet-sandbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: sandbox_minio_admin_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - sdet-sandbox-net

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sdet-sandbox-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./init-minio.sh:/init-minio.sh:ro
      - ./policies:/policies:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - sdet-sandbox-net

networks:
  sdet-sandbox-net:
    name: sdet-sandbox-net
    driver: bridge
